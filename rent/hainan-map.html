<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海南地图</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(120% 80% at 50% 0%, #f4fbff 0%, rgba(244,251,255,0) 60%),
      linear-gradient(180deg, #e4f3ff 0%, #d3e9fb 55%, #c6e2f7 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #2c5b79;
    overflow: hidden;
  }
  .wrap { display: contents; }
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg#map { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  svg#map.grabbing { cursor: grabbing; }

  #sea { pointer-events: none; }
  .region {
    fill: #ffffff;
    stroke: #8fbdd8;
    stroke-width: 1.2;
    stroke-linejoin: round;
    cursor: pointer;
    transition: fill .12s ease;
  }
  /* hover 只高亮当前市县 */
  .region:hover {
    fill: #ffca6b;
    stroke: #d98514;
    stroke-width: 1.8;
  }
  svg.grabbing .region:hover { fill: #ffffff; stroke: #8fbdd8; stroke-width: 1.2; }

  .zoom {
    position: absolute;
    right: 10px;
    bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .zoom button {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .55);
    background: rgba(255, 255, 255, .32);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: #2b6b95;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(41, 101, 145, .14);
    transition: background .15s ease;
  }
  .zoom button:hover { background: rgba(255, 255, 255, .55); }

  .label {
    font-size: 15px;
    font-weight: 500;
    fill: #2b6b95;
    letter-spacing: .5px;
    text-anchor: middle;
    dominant-baseline: central;
    paint-order: stroke;
    stroke: rgba(255, 255, 255, .95);
    stroke-width: 3px;
    stroke-linejoin: round;
    pointer-events: none;
    user-select: none;
  }
  svg.lang-en .label, svg.lang-ru .label { font-size: 12px; }

  .ap-mark { fill: #1f7cb8; stroke: #ffffff; stroke-width: 1.8; }
  .ap-icon {
    fill: #ffffff;
    font-size: 11px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .ap-label {
    font-size: 13px;
    font-weight: 600;
    fill: #14577f;
    text-anchor: middle;
    paint-order: stroke;
    stroke: rgba(255, 255, 255, .95);
    stroke-width: 3px;
    stroke-linejoin: round;
    pointer-events: none;
    user-select: none;
  }
  svg.lang-en .ap-label, svg.lang-ru .ap-label { font-size: 11px; }

  #amap {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: #c6e2f7;
    display: none;
  }
  #amap.amap-show { display: block; }
  .landmark-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #e08a3c;
    border: 2px solid #ffffff;
    box-shadow: 0 1px 5px rgba(0, 0, 0, .35);
  }
  .amap-marker-label {
    border: 0 !important;
    background: rgba(255, 255, 255, .88) !important;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    padding: 1px 6px !important;
    border-radius: 6px !important;
    font-size: 12px !important;
    color: #2c5b79 !important;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(41, 101, 145, .2);
  }
  .amap-info-content { font-size: 13px; line-height: 1.5; color: #2c5b79; }
  .amap-info-content b { color: #8a4d12; }

  /* 乡镇名称标注：纯展示 div，pointer-events:none，不参与高德拾取，点击穿透到色块 */
  .town-label {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
    background: rgba(255, 255, 255, .86);
    border-radius: 6px;
    padding: 1px 5px;
    color: #255a7a;
    font-size: 12px;
    white-space: nowrap;
    box-shadow: 0 1px 3px rgba(41, 101, 145, .22);
    z-index: 95;
    user-select: none;
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    margin: 0;
    padding: 5px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .35);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, .5);
    font-size: 12px;
    letter-spacing: 1px;
    color: #4c7d9c;
    pointer-events: none;
    user-select: none;
    z-index: 60;
    max-width: 92vw;
    text-align: center;
  }

  .lang {
    position: fixed;
    top: 20px;
    right: 22px;
    display: flex;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .35);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, .5);
    box-shadow: 0 4px 12px rgba(41, 101, 145, .12);
    z-index: 60;
  }
  .lang button {
    border: 0;
    background: transparent;
    color: #4c7d9c;
    font-family: inherit;
    font-size: 13px;
    line-height: 1;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  .lang button.on { background: rgba(90, 169, 221, .85); color: #fff; }
  /* 嵌入主站租房页（/rent?embed=1）时隐藏页内语言切换，由主站顶栏统一控制 */
  .embed-mode .lang { display: none; }

  .back {
    position: fixed;
    top: 20px;
    left: 22px;
    z-index: 60;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .55);
    background: rgba(255, 255, 255, .32);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: #2b6b95;
    font-family: inherit;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(41, 101, 145, .12);
    transition: background .15s ease;
  }
  .back:hover { background: rgba(255, 255, 255, .55); }
  .back.show { display: flex; }

  .tip {
    position: fixed;
    max-width: 260px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, .85);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, .6);
    box-shadow: 0 6px 18px rgba(41, 101, 145, .18);
    font-size: 12px;
    line-height: 1.5;
    color: #2c5b79;
    pointer-events: none;
    z-index: 80;
    display: none;
  }
  .tip b { display: block; font-size: 13px; color: #8a4d12; margin-bottom: 2px; }

  /* ===== 第 3 级：租房需求登记表单页 ===== */
  .lead {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    overflow-y: auto;
    padding: 22px 16px 48px;
    background: linear-gradient(180deg, #eaf6ff 0%, #d9edfc 55%, #c9e3f7 100%);
    -webkit-overflow-scrolling: touch;
  }
  .lead.show { display: block; }
  .lead-sheet {
    max-width: 760px;
    margin: 0 auto;
    padding: 22px clamp(16px, 4vw, 32px) 20px;
    background: rgba(255, 255, 255, .95);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 20px;
    box-shadow: 0 18px 46px rgba(30, 90, 130, .18);
  }
  .lead-head {
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px dashed #d5e7f4;
  }
  .lead-head h2 {
    margin: 0 0 6px;
    font-size: clamp(19px, 4.4vw, 26px);
    line-height: 1.35;
    letter-spacing: .5px;
    color: #1d4f70;
  }
  .lead-head p { margin: 0; font-size: 12.5px; color: #6d93ab; }

  /* 宽屏下聊天窗与表单并排，表单左移避免被遮挡 */
  @media (min-width: 1100px) {
    .lead.with-chat .lead-sheet {
      margin-left: max(24px, calc((100vw - 760px - 400px) / 2));
      margin-right: auto;
    }
  }

  .q { margin: 0 0 18px; }
  .q h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 9px;
    font-size: 14.5px;
    font-weight: 600;
    color: #255a7a;
  }
  .q h3 i {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #e3f2fd;
    color: #2b7bb8;
    font-size: 12px;
    font-style: normal;
  }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .opt {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 10px;
    border: 1.5px solid #d3e5f2;
    border-radius: 11px;
    background: #f7fbff;
    font-size: 14px;
    color: #35617d;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:hover { border-color: #9fc9e4; background: #f0f9ff; }
  .opt input { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
  .opt .tick {
    flex: 0 0 auto;
    width: 15px;
    height: 15px;
    border: 1.5px solid #a9cbe2;
    border-radius: 50%;
    background: #fff;
    transition: .15s;
  }
  .opt.cb .tick { border-radius: 4px; }
  .opt.on { border-color: #4f9ed6; background: #e6f4fe; }
  .opt.on .tick { border-color: #4f9ed6; background: #4f9ed6; box-shadow: inset 0 0 0 2px #fff; }
  .opt.cb.on .tick { box-shadow: inset 0 0 0 3px #e6f4fe; }
  .opt.on .txt { color: #1a5b87; font-weight: 600; }

  .lead textarea {
    width: 100%;
    min-height: 84px;
    padding: 10px 12px;
    border: 1.5px solid #d3e5f2;
    border-radius: 11px;
    background: #f7fbff;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    color: #255a7a;
    resize: vertical;
    outline: none;
  }
  .lead textarea:focus { border-color: #4f9ed6; background: #fff; }

  .lead-err { margin: -6px 0 12px; font-size: 12.5px; color: #c0392b; }
  .lead-done {
    display: none;
    margin: 0 0 12px;
    padding: 10px 12px;
    border-radius: 11px;
    background: #e8f6ea;
    color: #2f7d4a;
    font-size: 13px;
    line-height: 1.55;
  }
  .lead-done.show { display: block; }

  .lead-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .lead-actions button {
    flex: 1 1 150px;
    padding: 13px 18px;
    border: 0;
    border-radius: 12px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    transition: filter .15s, background .15s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #5aa9dd, #2b7bb8);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 8px 20px rgba(43, 123, 184, .28);
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-primary:disabled { filter: grayscale(.35); cursor: default; box-shadow: none; }
  .btn-ghost { background: #eef6fc; color: #2b6b95; border: 1.5px solid #d3e5f2; }
  .btn-ghost:hover { background: #e2f1fb; }

  /* ===== 在线客服聊天窗 ===== */
  .chat-fab {
    position: fixed;
    right: 12px;
    bottom: 132px;
    z-index: 66;
    display: none;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    border: 1px solid rgba(255, 255, 255, .7);
    border-radius: 50%;
    background: linear-gradient(135deg, #5aa9dd, #2b7bb8);
    color: #fff;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(43, 123, 184, .34);
  }
  .chat-fab:hover { filter: brightness(1.08); }
  .chat-fab.show { display: flex; }

  .chat {
    position: fixed;
    right: 14px;
    bottom: 14px;
    z-index: 130;
    display: none;
    flex-direction: column;
    width: min(362px, calc(100vw - 28px));
    height: min(540px, 74vh);
    overflow: hidden;
    background: #fff;
    border: 1px solid rgba(255, 255, 255, .7);
    border-radius: 16px;
    box-shadow: 0 22px 54px rgba(20, 70, 110, .3);
  }
  .chat.show { display: flex; }
  .chat-head {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 11px 12px;
    background: linear-gradient(135deg, #4f9ed6, #2b7bb8);
    color: #fff;
  }
  .chat-head .dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: #8fe3a8; }
  .chat-head .dot.off { background: #ffd77a; }
  .chat-head .who { flex: 1; min-width: 0; }
  .chat-head .who b { display: block; font-size: 14px; }
  .chat-head .who small { display: block; margin-top: 1px; font-size: 11px; opacity: .85; }
  .chat-head button {
    padding: 2px 4px;
    border: 0;
    background: transparent;
    color: #fff;
    font-size: 20px;
    line-height: 1;
    opacity: .85;
    cursor: pointer;
  }
  .chat-body {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 9px;
    overflow-y: auto;
    padding: 12px;
    background: #f4faff;
  }
  .bubble {
    max-width: 84%;
    padding: 9px 12px;
    border-radius: 13px;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.bot {
    align-self: flex-start;
    background: #fff;
    color: #2c5b79;
    border: 1px solid #e0eef8;
    border-bottom-left-radius: 4px;
  }
  .bubble.me {
    align-self: flex-end;
    background: #4f9ed6;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.sys {
    align-self: center;
    max-width: 96%;
    padding: 5px 11px;
    border-radius: 99px;
    background: rgba(90, 169, 221, .12);
    color: #4c7d9c;
    font-size: 11.5px;
  }
  .chat-quick { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px 0; background: #f4faff; }
  .chat-quick button {
    flex: 0 0 auto;
    padding: 5px 10px;
    border: 1px solid #cfe3f2;
    border-radius: 99px;
    background: #fff;
    color: #35617d;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .chat-quick button:hover { background: #e6f4fe; }
  .chat-input {
    display: flex;
    gap: 8px;
    padding: 9px 10px 11px;
    background: #fff;
    border-top: 1px solid #edf5fb;
  }
  .chat-input input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1.5px solid #d3e5f2;
    border-radius: 10px;
    background: #f8fcff;
    font-family: inherit;
    font-size: 13px;
    color: #255a7a;
    outline: none;
  }
  .chat-input input:focus { border-color: #4f9ed6; background: #fff; }
  .chat-input button {
    flex: 0 0 auto;
    padding: 0 16px;
    border: 0;
    border-radius: 10px;
    background: #2b7bb8;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .chat-input button:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
  <div class="lang" id="lang">
    <button data-lang="zh" class="on">中文</button>
    <button data-lang="en">English</button>
    <button data-lang="ru">Русский</button>
  </div>
  <button class="back" id="back">← <span id="backTxt">返回全省地图</span></button>
  <div class="wrap">
    <div class="stage">
      <svg id="map" viewBox="0 0 1000 920" preserveAspectRatio="xMidYMid meet" role="img" aria-label="海南地图">
        <defs>
          <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2f7cb0" flood-opacity="0.18"/>
          </filter>
          <linearGradient id="seaGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="920">
            <stop offset="0" stop-color="#e4f3ff"/>
            <stop offset=".55" stop-color="#d3e9fb"/>
            <stop offset="1" stop-color="#c6e2f7"/>
          </linearGradient>
        </defs>
        <rect id="sea" x="0" y="0" width="1000" height="920" fill="url(#seaGrad)"/>
        <g id="regions" filter="url(#softShadow)"></g>
        <g id="labels"></g>
        <g id="airports"></g>
      </svg>
      <div class="zoom">
        <button id="zin" aria-label="放大">＋</button>
        <button id="zout" aria-label="缩小">－</button>
        <button id="zreset" aria-label="复位">⟲</button>
      </div>
    </div>
    <p class="hint" id="hint">滚轮或按钮缩放 · 拖动平移 · 点击市县查看地标 · 双击复位</p>
    <div class="tip" id="tip"></div>
  </div>
  <div id="amap"></div>

  <!-- 第 3 级：租房需求登记（点击任意乡镇自动带入镇名） -->
  <div class="lead" id="lead" role="dialog" aria-modal="true" aria-labelledby="leadTitle">
    <div class="lead-sheet">
      <div class="lead-head">
        <h2 id="leadTitle">【—】租房需求登记</h2>
        <p id="leadSub">填写后客服会与您联系，信息仅用于匹配房源</p>
      </div>
      <p class="lead-done" id="leadDone"></p>
      <form id="leadForm" novalidate>
        <div class="q">
          <h3><i>1</i>户型（单选）</h3>
          <div class="opts">
            <label class="opt"><input type="radio" name="layout" value="一室"><span class="tick"></span><span class="txt">一室</span></label>
            <label class="opt"><input type="radio" name="layout" value="两室"><span class="tick"></span><span class="txt">两室</span></label>
            <label class="opt"><input type="radio" name="layout" value="三室"><span class="tick"></span><span class="txt">三室</span></label>
            <label class="opt"><input type="radio" name="layout" value="四室及以上"><span class="tick"></span><span class="txt">四室及以上</span></label>
          </div>
        </div>
        <div class="q">
          <h3><i>2</i>租住时长（单选）</h3>
          <div class="opts">
            <label class="opt"><input type="radio" name="duration" value="短期（1个月内）"><span class="tick"></span><span class="txt">短期（1个月内）</span></label>
            <label class="opt"><input type="radio" name="duration" value="中期（1–6个月）"><span class="tick"></span><span class="txt">中期（1–6个月）</span></label>
            <label class="opt"><input type="radio" name="duration" value="长期（6个月以上）"><span class="tick"></span><span class="txt">长期（6个月以上）</span></label>
          </div>
        </div>
        <div class="q">
          <h3><i>3</i>预算（单选）</h3>
          <div class="opts">
            <label class="opt"><input type="radio" name="budget" value="3000以内"><span class="tick"></span><span class="txt">3000以内</span></label>
            <label class="opt"><input type="radio" name="budget" value="3000–6000"><span class="tick"></span><span class="txt">3000–6000</span></label>
            <label class="opt"><input type="radio" name="budget" value="6000–10000"><span class="tick"></span><span class="txt">6000–10000</span></label>
            <label class="opt"><input type="radio" name="budget" value="10000以上"><span class="tick"></span><span class="txt">10000以上</span></label>
          </div>
        </div>
        <div class="q">
          <h3><i>4</i>配套需求（可多选）</h3>
          <div class="opts">
            <label class="opt cb"><input type="checkbox" name="extras" value="带家具家电"><span class="tick"></span><span class="txt">带家具家电</span></label>
            <label class="opt cb"><input type="checkbox" name="extras" value="可以停车"><span class="tick"></span><span class="txt">可以停车</span></label>
            <label class="opt cb"><input type="checkbox" name="extras" value="近海"><span class="tick"></span><span class="txt">近海</span></label>
            <label class="opt cb"><input type="checkbox" name="extras" value="安静适合疗养"><span class="tick"></span><span class="txt">安静适合疗养</span></label>
            <label class="opt cb"><input type="checkbox" name="extras" value="允许做饭"><span class="tick"></span><span class="txt">允许做饭</span></label>
          </div>
        </div>
        <div class="q">
          <h3><i>5</i>其他需求</h3>

      if (px < minX) minX = px;
      if (px > maxX) maxX = px;
      if (py < minY) minY = py;
      if (py > maxY) maxY = py;

    vb.x = Math.min(bounds.x + bounds.w - vb.w, Math.max(bounds.x, vb.x));

      y: vb.y + (clientY - r.top - (r.height - vb.h * s) / 2) / s
    };
  }

    vb.x = p.x - (p.x - vb.x) * k;
    vb.y = p.y - (p.y - vb.y) * k;
    vb.w = nw;
    vb.h = nw * RATIO;
    clampVB();
    applyVB();
  }

  let amapLoadPromise = null;
  function loadAmap() {

  // 把当前市所有外边界环取出（GeoJSON MultiPolygon → 多个外环数组）
  function cityOuterRings(f) {
    const rings = [];
    f.geometry.coordinates.forEach(poly => {
      if (poly && poly.length) rings.push(poly[0].map(p => [p[0], p[1]]));
    });
    return rings;
  }

  // 计算城市边界的经纬度包围盒，用于设置地图视野
  function cityLngLatBounds(f) {
    let minLng = Infinity, maxLng = -Infinity, minLat = Infinity, maxLat = -Infinity;
    f.geometry.coordinates.forEach(poly => poly.forEach(ring => ring.forEach(([lo, la]) => {
      if (lo < minLng) minLng = lo;
      if (lo > maxLng) maxLng = lo;
      if (la < minLat) minLat = la;
      if (la > maxLat) maxLat = la;
    })));
    (SPOTS[f.properties.adcode] || []).forEach(s => {
      minLng = Math.min(minLng, s.lon); maxLng = Math.max(maxLng, s.lon);
      minLat = Math.min(minLat, s.lat); maxLat = Math.max(maxLat, s.lat);
    });
    return new AMap.Bounds([minLng, minLat], [maxLng, maxLat]);
  }

    const rings = [outer].concat(cityOuterRings(f));
    const mask = new AMap.Polygon({
      path: rings,
      strokeColor: '#7fb3d5',
      strokeWeight: 0,
      fillColor: '#c6e2f7',
      fillOpacity: 0.96,
      zIndex: 60,
      clickable: false,
      bubble: true
    });
    mask.setMap(amap);
    amapOverlays.push(mask);

  function buildCityBoundary(f) {

  // 半平面裁剪：保留相比站点 b 更靠近站点 a 的一侧（Sutherland–Hodgman）
  function clipByBisector(ring, a, b) {
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    const nx = b[0] - a[0], ny = b[1] - a[1];
    const side = p => (p[0] - mx) * nx + (p[1] - my) * ny;
    const out = [];
    for (let i = 0; i < ring.length; i++) {
      const p = ring[i], q = ring[(i + 1) % ring.length];
      const sp = side(p), sq = side(q);
      if (sp <= 0) out.push(p);
      if ((sp < 0 && sq > 0) || (sp > 0 && sq < 0)) {
        const t = sp / (sp - sq);
        out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]);
      }
    }
    return out;
  }

  // 以乡镇驻地为站点，把市界切成泰森多边形，得到每个乡镇的独立区块
  function voronoiCells(rings, sites) {
    return sites.map((site, i) => {
      const cells = [];
      rings.forEach(ring => {
        let poly = ring.map(p => [p[0], p[1]]);
        for (let j = 0; j < sites.length && poly.length >= 3; j++) {
          if (j === i) continue;
          poly = clipByBisector(poly, site.center, sites[j].center);
        }
        if (poly.length >= 3) cells.push(poly);
      });
      return cells;
    });
  }

  // 加载手绘乡镇 GeoJSON：优先取同名 .geojson 文件，失败退回内嵌数据
  function loadTownFeatures(adcode) {
    if (!TOWN_SOURCES[adcode]) return Promise.resolve(null);
    return fetch(TOWN_SOURCES[adcode])
      .then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(fc => (fc && fc.features) || null)

      fillColor: '#ffc46b', fillOpacity: 0.98,

    const label = document.createElement('div');

      if (!map || map !== amap) return;

      label.style.transform = 'translate(-50%,-50%) translate(' + px.getX() + 'px,' + px.getY() + 'px)';

  // 乡镇区块：每个乡镇一块独立多边形，hover 只高亮当前乡镇，点击弹归属
  function addTownPolygons(f) {
    const map = amap;
    const adcode = f.properties.adcode;
    const countyName = f.properties.name || '';

    // 有手绘边界（如屯昌县）→ 直接按 GeoJSON 渲染
    loadTownFeatures(adcode).then(features => {
      if (!map || map !== amap) return;
      if (features && features.length) {
        features.forEach((ft, i) => {
          const p = ft.properties || {};
          const rings = (ft.geometry.coordinates || []).map(r => r.map(pt => [pt[0], pt[1]]));
          if (!rings.length || !p.name || !p.label) return;
          drawTownBlock(map, p.county || countyName, p.name, p.label, rings, TOWN_COLORS[i % TOWN_COLORS.length]);
        });
        return;
      }
      voronoiTowns(map, f, adcode, countyName);
    });
  }

  // 无手绘边界的市县：按乡镇驻地做 Voronoi 切分
  function voronoiTowns(map, f, adcode, countyName) {
    const url = 'https://restapi.amap.com/v3/config/district?key=' + AMAP_KEY +
      '&keywords=' + encodeURIComponent(String(adcode)) + '&subdistrict=2&extensions=base';

    fetch(url).then(r => r.json()).then(data => {
      if (!map || map !== amap) return;
      const city = (data && data.districts && data.districts[0]) || null;
      if (!city) return;

      const byLevel = { district: [], street: [] };
      const collect = node => (node.districts || []).forEach(d => {
        if (d.center && byLevel[d.level]) {
          const parts = String(d.center).split(',');
          const lng = parseFloat(parts[0]), lat = parseFloat(parts[1]);
          if (!isNaN(lng) && !isNaN(lat)) byLevel[d.level].push({ name: d.name, center: [lng, lat] });
        }
        collect(d);
      });
      collect(city);

      // 优先乡镇/街道级；地级市若只有"XX区直辖"占位名，则退回区级
      let sites = byLevel.street.filter(s => !/直辖$/.test(s.name));
      if (sites.length < 2) sites = byLevel.district.length >= 2 ? byLevel.district : byLevel.street;
      if (sites.length < 2) return;

      const cells = voronoiCells(cityOuterRings(f), sites);

      cells.forEach((cellRings, i) => {
        if (!cellRings.length) return;
        drawTownBlock(map, countyName, sites[i].name, sites[i].center, cellRings, TOWN_COLORS[i % TOWN_COLORS.length]);
      });
    }).catch(() => { /* 静默失败：乡镇区块非核心功能 */ });
  }

  function beisuSid() {
    let id = '';
    try { id = sessionStorage.getItem('beisu_sid') || ''; } catch (e) {}
    if (!id || !/^[A-Za-z0-9_-]{1,64}$/.test(id)) {
      id = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : ('s_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9));

    [/(人工|客服|电话|微信|联系)/, '已记录您的需求，人工客服在线时会立即接入；离线时上线后第一时间联系您。']
  ];

  function localReply(text) {
    for (let i = 0; i < LOCAL_RULES.length; i++) {
      if (LOCAL_RULES[i][0].test(text)) return LOCAL_RULES[i][1];
    }
    return '这个问题我先记下了，客服上线后会结合您的登记信息回复您。您也可以补充预算、户型和租住时长，我帮您先匹配。';
  }

  function chatSessionId() {
    let id = sessionStorage.getItem('hk_chat_sid');
    if (!id) {
      id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      sessionStorage.setItem('hk_chat_sid', id);
    }
    return id;
  }

  function addBubble(text, kind) {
    const b = document.createElement('div');
    b.className = 'bubble ' + kind;
    b.textContent = text;
    chatBody.appendChild(b);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function setChatStatus(online) {
    chatOnline = online;
    chatDot.classList.toggle('off', !online);
    chatStatus.textContent = online ? '人工客服在线' : '智能助手 · 人工离线';
  }

  async function checkCs() {
    try {
      const r = await fetch('/api/cs/status');
      if (!r.ok) throw 0;
      const d = await r.json();
      setChatStatus(!!d.online);
    } catch (e) {
      const h = new Date().getHours();
      setChatStatus(h >= 9 && h < 22); // 接口不可用时按本地时间兜底
    }
  }

  async function openChat(lead) {
    if (lead) chatCtx = lead;
    chatEl.classList.add('show');
    chatFab.classList.remove('show');
    if (leadEl.classList.contains('show')) leadEl.classList.add('with-chat');
    await checkCs();
    if (!chatStarted) {
      chatStarted = true;
      addBubble('您好，这里是海南租房客服，有任何租房问题都可以问我。', 'bot');
    }
    if (lead) {
      const parts = [lead.town + '租房登记', lead.layout, lead.duration, lead.budget];
      if (lead.extras && lead.extras.length) parts.push(lead.extras.join('、'));
      addBubble('已收到您的登记：' + parts.join(' · '), 'sys');
      addBubble(chatOnline
        ? '人工客服已收到您的需求，正在接入，请稍候…'
        : '客服当前不在线，我先为您解答常见问题；上线后会第一时间联系您。', 'bot');
    }
    chatText.focus();
  }

  async function sendChat(text) {
    const msg = (text || '').trim();
    if (!msg || chatBusy) return;
    addBubble(msg, 'me');
    chatText.value = '';
    chatBusy = true;
    chatSendBtn.disabled = true;
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: chatSessionId(), message: msg, context: chatCtx })
      });
      if (!r.ok) throw 0;
      const d = await r.json();
      if (typeof d.online === 'boolean') setChatStatus(d.online);
      addBubble(d.reply || '（暂未收到回复）', d.mode === 'human' ? 'sys' : 'bot');
    } catch (e) {
      addBubble(localReply(msg), 'bot');
    }
    chatBusy = false;
    chatSendBtn.disabled = false;
    chatText.focus();
  }

  document.getElementById('chatClose').addEventListener('click', () => {
    chatEl.classList.remove('show');
    chatFab.classList.add('show');
    leadEl.classList.remove('with-chat');
  });
  chatFab.addEventListener('click', () => openChat(null));
  chatSendBtn.addEventListener('click', () => sendChat(chatText.value));
  chatText.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendChat(chatText.value); }
  });
  document.getElementById('chatQuick').addEventListener('click', e => {
    const b = e.target.closest('button[data-q]');
    if (b) sendChat(b.dataset.q);
  });
  chatFab.classList.add('show');

  window.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (chatEl.classList.contains('show')) {
      chatEl.classList.remove('show');
      chatFab.classList.add('show');
      return;
    }
    if (leadEl.classList.contains('show')) { closeLead(); return; }
    if (view === 'city') exitCity();
  });
})();
</script>
</body>
</html>
