<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游玩打卡点</title>
<link rel="stylesheet" href="/island/island.css">
<style>
  /* 本页是露营地图的第二个子页面：展示数据库里「游玩打卡」分类的那批点位
     （与全岛地图页读的是同一份数据，不用另外录入）。
     露营点图层（含城市 / 机场地标）在这里不加载，画面上只有游玩打卡点。
     样式沿用第一页的浅蓝底色与纯文字浮层，带 camp__ 前缀，互不干扰。 */
  body { background: #edf3fb; }
  .camp {
    position: relative; height: 100vh; overflow: hidden;
    background: radial-gradient(130% 95% at 50% 5%, #c9ddf4 0%, #d6e6f8 45%, #e3eefa 100%);
  }
  .camp > .map { position: relative; z-index: 1; width: 100%; height: 100%; }

  /* 语言切换：与主站同款的 .lang / .lang-opt 样式由 island.css 统一提供（右上角控件组内） */

  /* 顶部说明：当前是哪个露营点附近的打卡点、共几个（纯文字，无容器） */
  .camp__head {
    position: absolute; left: 18px; top: 14px; z-index: 3;
    max-width: 52vw; font-size: 12.5px; color: #4c5a70; line-height: 1.65;
    pointer-events: none;
  }
  .camp__head b { display: block; font-size: 15px; color: #1f2d3d; margin-bottom: 3px; }
  .camp__head em { display: block; font-style: normal; color: #8a94a6; }

  /* 打卡点详情：页面最右下角，纯文字右对齐 */
  .camp__detail {
    position: absolute; right: 18px; bottom: 16px; z-index: 2;
    max-width: 44vw; text-align: right;
    font-size: 12.5px; color: #8a94a6; line-height: 1.7;
    pointer-events: none;
  }
  .camp__kind { font-size: 12px; font-weight: 700; color: #9a8b00; }
  .camp__name { margin: 2px 0 0; font-size: 16px; font-weight: 700; color: #1f2d3d; line-height: 1.45; }
  .camp__intro { margin: 4px 0 0; font-size: 12.5px; color: #4a5260; white-space: pre-wrap; }
  .camp__coords { margin: 4px 0 0; font-size: 12px; color: #8a94a6; }

  /* 未选中时的引导文字：与第一页完全同一套特效 ——
     高亮亮蓝文字 + 轻微半透明深色底衬（磨砂玻璃感），一道柔和高光缓慢横向掠过。
     文字本体大小 / 位置全程固定，不缩放、不做整体透明度闪烁，只靠光带移动吸引注意。
     注意：这里刻意不写 position —— 由基类 .camp__detail 的 absolute 把它钉在右下角。 */
  .camp__detail--hint {
    overflow: hidden;
    padding: 8px 15px; border-radius: 10px;
    background: rgba(18, 32, 52, .55);
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    box-shadow: 0 8px 22px rgba(18, 32, 52, .18);
    font-size: 13.5px; font-weight: 700; color: #9ecbff;
  }
  /* 高光带：只在底衬内部移动，不碰文字，因此文字始终纹丝不动 */
  .camp__detail--hint::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 45%;
    background: linear-gradient(100deg,
      rgba(255,255,255,0) 0%, rgba(255,255,255,.42) 50%, rgba(255,255,255,0) 100%);
    pointer-events: none;
    animation: campHintSweep 3.6s ease-in-out infinite;
  }
  @keyframes campHintSweep {
    0%,  10%  { transform: translateX(-130%); }   /* 停在左侧（不可见）稍作停顿 */
    60%, 100% { transform: translateX(330%);  }   /* 缓慢掠过后停在右侧（不可见） */
  }

  /* 露营点专属印记：详情框里那条紫色类型名 */
  .camp__kind--camp { color: #7b4bc4; }
  /* 顶部说明里追加的一行：上一步选中的是哪个露营点 */
  .camp__origin { margin: 6px 0 0; font-size: 12px; font-weight: 700; color: #7b4bc4; }
  /* 顶部说明里追加的一行：上一步填写的出行人数（含建议车型与装备套数） */
  .camp__people { margin: 6px 0 0; font-size: 12px; font-weight: 700; color: #2f7cf6; }

  /* 左下角：已多选的游玩打卡点（可单个取消，也可一键清空） */
  .camp__picked { position: absolute; left: 18px; bottom: 16px; z-index: 3; max-width: 40vw; }
  .camp__picked-hd { font-size: 12.5px; font-weight: 700; color: #1f2d3d; }
  .camp__picked-hd b { color: #e0492f; font-size: 14px; }
  .camp__picked-tip { margin-top: 3px; font-size: 11.5px; color: #8a94a6; line-height: 1.5; }
  .camp__chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .camp__chip {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid #f2cbc3; background: #fff6f3; color: #c5402a;
    border-radius: 999px; padding: 3px 9px;
    font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .camp__chip:hover { background: #ffe9e3; }
  .camp__chip i { font-style: normal; font-weight: 700; }
  .camp__chip--clear { border-color: #dde5f0; background: #f4f7fc; color: #5a6a82; }

  /* 行程信息卡（称呼 / 联系方式 / 备注）：已按需求隐藏，不再展示也不收集游客联系方式 */
  .camp__form { display: none; }

  /* 出行方式操作区：免拼 / 拼团 两个并排主按钮 + 正下方居中的价格区间，
     整体固定在页面右侧垂直居中。未选中打卡点时按钮禁用（灰显），选中即启用。 */
  .camp__cta {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%); z-index: 6;
    width: 248px; text-align: center;
  }
  .camp__cta-btns { display: flex; gap: 10px; }
  .camp__cta-btn {
    flex: 1; height: 40px; padding: 0 6px;
    border: 0; border-radius: 999px;
    background: #2f7cf6; color: #fff;
    font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 24px rgba(47,124,246,.3);
    transition: background .18s ease, box-shadow .18s ease;
    white-space: nowrap;
  }
  .camp__cta-btn:hover:not(:disabled) { background: #2a6ee0; }
  .camp__cta-btn:disabled { background: #b8c4d4; box-shadow: none; cursor: not-allowed; }
  /* 价格区间：按钮正下方居中。数值由后台配置，未配置时先占位展示 */
  .camp__cta-price { margin-top: 10px; font-size: 11.5px; color: #8a94a6; line-height: 1.6; }
  .camp__cta-price b { display: block; font-size: 14.5px; color: #1f2d3d; }
  /* 修改人数小入口：不强制二次填写，只是给中途想改的人一个轻量出口 */
  .camp__cta-edit {
    margin-top: 5px; padding: 2px 6px; border: 0; background: none;
    font: inherit; font-size: 11.5px; color: #2f7cf6; cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .camp__cta-edit:hover { color: #2a6ee0; }
  .camp__cta-edit[hidden] { display: none; }

  /* 人数弹窗：点「免拼 / 拼团」后弹出，填 1-9 的整数人数，确认即提交；
     超过 9 人提示联系客服定制 */
  .camp-people-mask {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(18, 32, 52, .45);
    display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .camp-people-mask[hidden] { display: none; }
  .camp-people {
    width: min(320px, 86vw); background: #fff; border-radius: 16px;
    padding: 22px 20px 18px; box-shadow: 0 18px 50px rgba(18, 32, 52, .3);
  }
  .camp-people__title { font-size: 15px; font-weight: 700; color: #1f2d3d; }
  .camp-people__tip { margin-top: 6px; font-size: 12px; color: #8a94a6; line-height: 1.6; }
  .camp-people__input {
    margin-top: 12px; width: 100%; box-sizing: border-box;
    height: 42px; padding: 0 14px; font: inherit; font-size: 15px;
    border: 1.5px solid #dde5f0; border-radius: 10px; outline: none;
  }
  .camp-people__input:focus { border-color: #2f7cf6; }
  .camp-people__err { min-height: 18px; margin-top: 6px; font-size: 12px; color: #e0492f; }
  .camp-people__btns { display: flex; gap: 10px; margin-top: 4px; }
  .camp-people__btn {
    flex: 1; height: 40px; border: 0; border-radius: 999px;
    font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .camp-people__btn--ok { background: #2f7cf6; color: #fff; }
  .camp-people__btn--ok:hover { background: #2a6ee0; }
  .camp-people__btn--cancel { background: #f4f7fc; color: #5a6a82; }

  /* 底部信息卡占位：把左下「已选」与右下「详情」整体上移，避免互相遮挡 */
  .camp__picked, .camp__detail { bottom: 112px; }

  @media (max-width: 820px) {
    .camp__picked, .camp__detail { bottom: 176px; max-width: 64vw; }
    .camp__cta { width: 216px; }
    .camp__cta-btn { font-size: 12.5px; }
  }
</style>
</head>
<body>

<div class="camp">
  <div id="campMap" class="map"></div>

  <!-- 右上角控件组：返回首页 + 语言切换（三个独立选项，与主站同款） -->
  <div class="island-top">
    <a class="island-back" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span id="campBack">返回首页</span>
    </a>
    <div class="lang" id="campLangs">
      <button type="button" class="lang-opt" data-lang="zh">中文</button>
      <button type="button" class="lang-opt" data-lang="en">English</button>
      <button type="button" class="lang-opt" data-lang="ru">Русский</button>
    </div>
  </div>

  <!-- 顶部说明：露营点名称 + 打卡点数量 -->
  <div class="camp__head" id="campHead"></div>

  <!-- 打卡点详情：点击地图上的标记后显示在页面右下角 -->
  <div class="camp__detail" id="campDetail"></div>

  <!-- 已选游玩打卡点：支持多选，点标签上的 × 可单个取消 -->
  <div class="camp__picked" id="campPicked"></div>

  <!-- 行程信息卡：按需求隐藏，不再收集游客联系方式 -->
  <div class="camp__form" id="campForm"></div>

  <!-- 出行方式二选一 + 价格区间：固定在页面右侧垂直居中。
       未选中打卡点时两个按钮保持禁用。人数在第一步地图页已填写并全局缓存，
       这里点按钮直接提交，不再重复询问；下方提供「修改人数」小入口。 -->
  <div class="camp__cta" id="campCta">
    <div class="camp__cta-btns">
      <button type="button" class="camp__cta-btn" id="ctaPrivate" disabled></button>
      <button type="button" class="camp__cta-btn" id="ctaShared" disabled></button>
    </div>
    <div class="camp__cta-price" id="ctaPrice"></div>
    <button type="button" class="camp__cta-edit" id="ctaEdit" hidden></button>
  </div>

  <!-- 人数弹窗：仅在第一步未填人数（如直接从地址打开本页）或点「修改人数」时出现 -->
  <div class="camp-people-mask" id="peopleMask" hidden>
    <div class="camp-people" role="dialog" aria-modal="true">
      <div class="camp-people__title" id="peopleTitle"></div>
      <div class="camp-people__tip" id="peopleTip"></div>
      <input class="camp-people__input" id="peopleInput" type="number" min="1" max="9" step="1" inputmode="numeric">
      <div class="camp-people__err" id="peopleErr"></div>
      <div class="camp-people__btns">
        <button type="button" class="camp-people__btn camp-people__btn--cancel" id="peopleCancel"></button>
        <button type="button" class="camp-people__btn camp-people__btn--ok" id="peopleOk"></button>
      </div>
    </div>
  </div>
</div>

<script src="/island/echarts.min.js"></script>
<script src="/island/hainan.geojson.js"></script>
<script src="/island/map.js"></script>

  var map = null;
  var spots = [];                      /* 游玩打卡点（直接读库里「游玩打卡」分类那批点位） */
  var kind = null;                     /* 该分类在后台的配色 / 名称，与地图页保持一致 */

  var editingPeople = false;           /* true = 用户点「修改人数」，弹窗只保存不提交 */

  var selIds = [];                     /* 已多选的游玩打卡点 id，按选择先后排列 */

  /* 人数匹配车型：1-3 人 → 5 座，4-6 人 → 7 座，7-9 人 → 9 座 */
  function seatsOf(n) { return n <= 3 ? 5 : (n <= 6 ? 7 : 9); }

  /* 各图层配色：露营点用专属紫色大头针，与黄色的打卡点、红色的「已选」一眼区分 */
  var CAMP_KEY = 'camp', CAMP_COLOR = '#7b4bc4';
  var PLAY_SEL_KEY = 'playSel', PLAY_SEL_COLOR = '#e0492f';

  function t() { return T[lang] || T.zh; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  /* 取三语字段里当前语种的值，缺该语种时回落到中文 */
  function pick(i18n, fallback) {
    if (i18n && i18n[lang]) return i18n[lang];
    if (i18n && i18n.zh) return i18n.zh;
    return fallback || '';
  }
  function spotName(s) { return pick(s && s.names, '') || t().unnamed; }

  /* 地图数据：游玩打卡点一层（未选的黄点 / 已选的红点），不传其它露营点、也不传城市与机场地标。
     名称与颜色沿用后台给这个分类的配置（与全岛地图页上那一批一致）。 */
  function isSel(id) { return selIds.indexOf(id) >= 0; }
  /* 未选中的打卡点分类 key，同时也是「挂呼吸光晕」的那一层 */
  function playKey() { return (kind && kind.key) || 'play'; }

  function mapCategories() {
    return [
      /* 待点击：细描边的小黄点，外圈由 __halo__ 系列叠一圈呼吸光晕，暗示「这个可以点」 */
      { key: playKey(), name: (kind && kind.name) || t().kindFallback,
        color: (kind && kind.color) || '#d2cc1e',
        symbol: (kind && kind.symbol) || 'circle',
        symbolSize: (kind && kind.symbolSize) || 14, z: 20 },
      /* 已选中：比黄点大一圈、粗白描边 + 重投影的红色徽章，完全静止 ——
         与「会呼吸的小黄点」在静止画面里也一眼分得开（第一页同一套两态设计）。 */
      { key: PLAY_SEL_KEY, name: t().selLabel, color: PLAY_SEL_COLOR,
        symbol: 'circle', symbolSize: 24, z: 26,
        borderColor: '#fff', borderWidth: 3.5, shadowBlur: 14,
        shadowColor: 'rgba(224,73,47,.45)' }
    ];
  }
  function mapPoints() {
    return spots.map(function (s) {
      return {
        id: s.id, name: spotName(s), lng: +s.lng, lat: +s.lat,
        categories: [isSel(s.id) ? PLAY_SEL_KEY : playKey()]
      };
    });
  }
  /* 上一步选中的露营点：单独走「地标层」渲染 —— 该层不被密集区聚合，
     因此它始终是一个独立的紫色大头针，不会被别的点合并成气泡藏起来。 */
  function campLandmarks() {
    if (!campSite) return [];
    return [{
      key: CAMP_KEY,
      name: t().campLabel,
      color: CAMP_COLOR,
      symbol: 'pin',
      symbolSize: 46,
      z: 32,
      points: [{
        id: campSite.id,
        name: pick(campSite.names, campSite.name) || t().campLabel,
        lng: +campSite.lng,
        lat: +campSite.lat
      }]
    }];
  }

  /* 悬浮提示：默认提示是固定的中文，这里按当前语种覆盖成打卡点的名称与简介 */
  function applyTooltip() {
    if (!map || !map.chart) return;
    map.chart.setOption({
      tooltip: {
        formatter: function (pp) {
          var d = pp.data || {};
          if (d.kind === 'bubble' || d.kind === 'collapse' || d.kind === 'route') return '';
          if (d.cluster) return '';
          if (pp.componentType === 'geo') return '';
          var r = d.raw || {};
          /* 露营点走地标层，它的名称放在 raw 里，series 的 name 是分组名 */
          var nm = (d.landmark && r.name) || d.name || t().unnamed;
          var intro = d.landmark ? '' : pick(r.intro, '');
          return '<b>' + esc(nm) + '</b>' +
                 (intro ? '<br><span style="opacity:.78">' + esc(intro) + '</span>' : '');
        }
      }
    });
  }

  function refreshMap() {
    if (!map) return;
    map.update({ categories: mapCategories(), points: mapPoints(), landmarks: campLandmarks() });
    applyTooltip();
  }
  /* 多选状态变了：重画地图 + 刷新左下角已选清单 + 同步提交按钮可用态 */
  function redraw() { refreshMap(); renderPicked(); syncSubmit(); }
  function selectSpot(id) { if (!isSel(id)) selIds.push(id); redraw(); }
  function unselectSpot(id) {
    var i = selIds.indexOf(id);
    if (i >= 0) selIds.splice(i, 1);
    redraw();
  }
  function toggleSpot(id) { if (isSel(id)) unselectSpot(id); else selectSpot(id); }

  /* 免拼 / 拼团 双按钮：选中至少一个打卡点即启用，否则禁用（提交中保持禁用） */
  function syncSubmit() {
    var busy = !!$('ctaPrivate').dataset.busy;
    var off = busy || !selIds.length;
    $('ctaPrivate').disabled = off;
    $('ctaShared').disabled = off;
  }

  /* 价格区间：后台配置了 min/max 才显示数值，否则占位提示 */
  function renderPrice() {
    var d = t();
    if (priceCfg.min > 0 && priceCfg.max > 0) {
      $('ctaPrice').innerHTML = esc(d.priceLabel) +
        '<b>¥' + priceCfg.min + ' - ¥' + priceCfg.max + ' ' + esc(d.perDay) + '</b>';
    } else {
      $('ctaPrice').innerHTML = esc(d.priceLabel) + '<b>' + esc(d.priceUnset) + '</b>';
    }
  }

  /* 顶部说明：全岛游玩打卡点共几个；并标出上一步选中的露营点 */
  function renderHead() {
    var html = '<b>' + esc(t().title) + '</b>' +
               '<em>' + esc(t().count(spots.length)) + '</em>';
    if (campSite) {
      html += '<div class="camp__origin">' +
              esc(t().origin(pick(campSite.names, campSite.name))) + '</div>';
    }
    $('campHead').innerHTML = html;
  }

  function findSpot(id) {
    for (var i = 0; i < spots.length; i++) if (spots[i].id === id) return spots[i];
    return null;
  }
  /* 右下角详情：显示最近点过的那个标记（露营点或游玩打卡点） */
  function renderDetail() {
    var box = $('campDetail');
    if (campSite && detailId === campSite.id) {           /* 上一步选中的露营点 */
      box.className = 'camp__detail';                     /* 有内容：去掉引导态，恢复正常文字样式 */
      box.innerHTML =
        '<div class="camp__kind camp__kind--camp">' + esc(t().campLabel) + '</div>' +
        '<div class="camp__name">' + esc(pick(campSite.names, campSite.name)) + '</div>' +
        '<div class="camp__coords">' + esc(t().coords) + ' ' +
          (+campSite.lng).toFixed(5) + ', ' + (+campSite.lat).toFixed(5) + '</div>';
      return;
    }
    var s = findSpot(detailId);
    if (!s) {
      /* 还没有点过：给一行带扫光的引导文字（与第一页同一套特效）。
         库里一个打卡点都没有时是「无数据」提示，不长成引导气泡。 */
      if (!spots.length) {
        box.className = 'camp__detail';
        box.textContent = t().empty;
        return;
      }
      box.className = 'camp__detail camp__detail--hint';
      box.textContent = t().hint;
      return;
    }
    box.className = 'camp__detail';
    var intro = pick(s.intro, '');
    box.innerHTML =
      '<div class="camp__kind">' + esc(t().kindLabel) + '</div>' +
      '<div class="camp__name">' + esc(spotName(s)) + '</div>' +
      (intro ? '<div class="camp__intro">' + esc(intro) + '</div>'
             : '<div class="camp__intro" style="color:#a2abb9">' + esc(t().noIntro) + '</div>') +
      '<div class="camp__coords">' + esc(t().coords) + ' ' + (+s.lng).toFixed(5) + ', ' + (+s.lat).toFixed(5) + '</div>';
  }

  /* 左下角：已多选的游玩打卡点清单（点标签可单个取消，另有清空） */
  function renderPicked() {
    var box = $('campPicked');
    if (!selIds.length) {
      box.innerHTML = '<div class="camp__picked-tip">' + esc(t().pickedNone) + '</div>';
      return;
    }
    var chips = selIds.map(function (id) {
      var s = findSpot(id);
      return '<button type="button" class="camp__chip" data-off="' + esc(id) + '">' +
             esc(s ? spotName(s) : t().unnamed) + '<i>&times;</i></button>';
    }).join('');

    box.innerHTML =
      '<div class="camp__picked-hd">' + t().pickedHd(selIds.length) + '</div>' +
      '<div class="camp__chips">' + chips +
        '<button type="button" class="camp__chip camp__chip--clear" data-off="">' +
        esc(t().clearAll) + '</button>' +
      '</div>' +
      '<div class="camp__picked-tip">' + esc(t().pickedTip) + '</div>';

    Array.prototype.forEach.call(box.querySelectorAll('[data-off]'), function (b) {
      b.onclick = function () {
        var id = b.dataset.off;
        if (id) unselectSpot(id);
        else { selIds = []; redraw(); }          /* 清空 */
      };
    });
  }

  /* 切换语种：页内文字 + 顶部说明 + 详情 + 地图标签（含悬浮提示）全部同步刷新 */
  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    document.title = t().title;
    Array.prototype.forEach.call($('campLangs').children, function (b) {
      b.classList.toggle('active', b.dataset.lang === lang);   /* 选中项高亮：与主站语言切换同款 */
    });
    $('campBack').textContent = t().back;          /* 返回首页入口文字跟随语种 */
    renderForm();                                  /* 行程信息卡：标题 / 输入提示 / 按钮文字跟随语种 */
    renderHead();
    renderDetail();
    renderPicked();
    refreshMap();
  }
  function setLang(next) {
    if (LANGS.indexOf(next) < 0) next = 'zh';
    lang = next;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLang();
  }
  Array.prototype.forEach.call($('campLangs').children, function (b) {
    b.onclick = function () { setLang(b.dataset.lang); };
  });

  /* ---------- 出行方式 + 人数 + 提交 ----------
     右侧「免拼 / 拼团」二选一。人数已在第一步地图页填写并全局缓存（localStorage），
     这里点按钮直接沿用该人数提交，不再弹出输入框；只有缓存为空（直接从地址
     打开本页）才回退到弹窗，另外提供「修改人数」小入口供中途调整。
     提交体带选中的点位 ID + 出行方式 + 人数，后台按「点位ID + 方式 + 人数 +
     当前打卡时间」记录，不收集游客称呼或联系方式。 */
  function renderForm() {
    var d = t();
    $('ctaPrivate').textContent = d.tourPrivate;
    $('ctaShared').textContent = d.tourShared;
    $('peopleTip').textContent = d.peopleTip;
    $('peopleInput').placeholder = d.peoplePh;
    $('peopleCancel').textContent = d.peopleCancel;
    renderPrice();
    renderPeopleEntry();
  }
  /* 「修改人数」小入口：显示了当前人数，点它可改；没有缓存人数时隐藏 */
  function renderPeopleEntry() {
    var d = t();
    var btn = $('ctaEdit');
    if (people > 0) {
      btn.hidden = false;
      btn.textContent = d.peopleCurrent(people) + ' · ' + d.peopleEdit;
    } else {
      btn.hidden = true;
    }
  }
  /* 弹窗：editing = true 表示只是修改人数（不提交）；否则是第一步没填人的兜底 */
  function openPeople(editing) {
    editingPeople = !!editing;
    var d = t();
    $('peopleTitle').textContent = editingPeople ? d.peopleEditTitle : d.peopleTitle;
    $('peopleInput').value = people > 0 ? people : '';
    $('peopleOk').textContent = editingPeople ? d.peopleSave : d.peopleOk;
    $('peopleErr').textContent = '';
    $('peopleMask').hidden = false;
    setTimeout(function () { $('peopleInput').focus(); }, 30);
  }
  function closePeople() { $('peopleMask').hidden = true; }
  /* 弹窗确认：校验 1-9 整数人数并写入全局缓存；修改模式只保存，否则直接提交 */
  function confirmPeople() {
    var d = t();
    var raw = $('peopleInput').value.trim();
    if (!raw) { $('peopleErr').textContent = d.peopleErrEmpty; return; }
    if (!/^\d+$/.test(raw)) { $('peopleErr').textContent = d.peopleErrRange; return; }
    var n = parseInt(raw, 10);
    if (n < 1) { $('peopleErr').textContent = d.peopleErrRange; return; }
    if (n > 9) { $('peopleErr').textContent = d.peopleOver; return; }
    people = n;
    try { localStorage.setItem(PEOPLE_KEY, String(n)); } catch (e) {}   /* 与第一步共用同一份缓存 */
    closePeople();
    renderPeopleEntry();
    if (!editingPeople) doSubmit();
  }
  /* 点免拼 / 拼团：已有缓存人数则直接提交，跳过二次填写 */
  function pickTour(type) {
    if (!campSite) { alert(t().needCamp); return; }
    if (!selIds.length) { alert(t().needSpot); return; }
    tourType = type;
    if (people > 0) { doSubmit(); return; }
    openPeople(false);                 /* 仅兜底：第一步没填人数时 */
  }
  $('ctaPrivate').onclick = function () {
    if (this.disabled || this.dataset.busy) return;
    pickTour('private');
  };
  $('ctaShared').onclick = function () {
    if (this.disabled || this.dataset.busy) return;
    pickTour('shared');
  };
  $('ctaEdit').onclick = function () {
    if ($('ctaPrivate').dataset.busy) return;
    openPeople(true);
  };
  $('peopleOk').onclick = confirmPeople;
  $('peopleCancel').onclick = closePeople;
  $('peopleMask').onclick = function (ev) { if (ev.target === this) closePeople(); };
  $('peopleInput').onkeydown = function (ev) {
    if (ev.key === 'Enter') confirmPeople();
    else if (ev.key === 'Escape') closePeople();
  };

  function doSubmit() {
    var sid = '';
    try { sid = sessionStorage.getItem('beisu_sid') || ''; } catch (e) {}
    if (!sid) {
      sid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('s_' + Date.now());
      try { sessionStorage.setItem('beisu_sid', sid); } catch (e) {}
    }

    $('ctaPrivate').dataset.busy = '1';
    syncSubmit();
    fetch('/api/island/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sessionId: sid, lang: lang,
        camp: { id: campSite.id, name: pick(campSite.names, campSite.name) },
        spots: selIds.slice(),
        tourType: tourType,                /* 出行方式：private 免拼 / shared 拼团 */
        people: people                     /* 弹窗确认的出行人数（1-9） */
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) throw new Error((d && d.error) || '');
        if (d.sid) { try { sessionStorage.setItem('beisu_sid', d.sid); } catch (e) {} }
        location.href = '/';                     /* 回到主站，右侧聊天框同步显示这条行程 */
      })
      .catch(function (e) {
        alert(t().submitFail + (e.message || ''));
        delete $('ctaPrivate').dataset.busy;
        syncSubmit();
      });
  }

  /* 直接向服务端接口取数据（接口读的是本地数据库），不抓取任何网页。
     1) /api/play-points 取「游玩打卡」分类那批点位（与全岛地图页同一份数据）；
     2) 若地址带 ?point=，再从 /api/camp-points 取回上一步选中的露营点，
        在本页用专属紫色印记标出来。 */
  function boot() {
    var saved = '';
    try { saved = localStorage.getItem(LANG_KEY) || ''; } catch (e) {}
    lang = LANGS.indexOf(saved) >= 0 ? saved : 'zh';
    /* 出行人数：沿用第一步地图页写入的全局缓存（1-9 之外的脏值一律视为未填） */
    try {
      var pn = parseInt(localStorage.getItem(PEOPLE_KEY), 10);
      if (pn >= 1 && pn <= 9) people = pn;
    } catch (e) {}
    applyLang();

    var pid = '';
    try { pid = new URLSearchParams(location.search).get('point') || ''; } catch (e) {}

    /* 价格区间配置：后台录入的 min/max，未配置时保持 0（前端占位展示） */
    fetch('/api/island-config', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (c) {
        if (c && +c.priceMin > 0 && +c.priceMax > 0) {
          priceCfg = { min: +c.priceMin, max: +c.priceMax };
          renderPrice();
        }
      })
      .catch(function () {});              /* 配置拉取失败不影响页面其余功能 */

    fetch('/api/play-points', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        kind = d.category || null;
        spots = (d.points || []).filter(function (s) {
          return s && isFinite(+s.lng) && isFinite(+s.lat);
        });
        if (!pid) return null;
        return fetch('/api/camp-points', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (c) {
            var arr = c.points || [];
            campSite = arr.filter(function (x) { return x.id === pid; })[0] || null;
          });
      })
      .then(function () {
        /* 只建「游玩打卡点」这一层；上一步选中的露营点作为地标层的专属印记单独绘制 */
        map = window.HainanMap.create($('campMap'), {
          categories: mapCategories(),
          points: mapPoints(),
          landmarks: campLandmarks(),
          roam: true,
          legend: false,
          labelMode: 'always',        /* 打卡点数量不多，名称直接常显 */
          labelKinds: false,
          /* 与第一页同一套两态设计：所有「待点击」的打卡点圆点默认带一圈缓慢呼吸光晕，
             表示「这个可以点」；一旦点中被选中，它就换到红色高亮徽章那一层、光晕自动撤掉。 */
          haloCategory: [playKey()],
          onClick: function (ev) {
            var d2 = ev && ev.data;
            /* 聚合气泡 / 同心环：交给地图自身展开收起，不当作选点 */
            if (!d2 || d2.cluster) return;
            var id = d2.pointId;
            if (!id) return;

            if (d2.landmark) {                  /* 点到露营点专属印记：只出详情，不进多选 */
              detailId = id;
              renderDetail();
              return;
            }
            if (!findSpot(id)) return;
            detailId = id;
            renderDetail();
            toggleSpot(id);                     /* 再点一次即取消，支持连续多选 */
          }
        });
        applyTooltip();
        applyLang();
      })
      .catch(function (e) {
        $('campDetail').textContent = t().loadFail + e.message;
      });
  }

  boot();
})();
</script>
</body>
</html>
