<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* 设备判断：只有「明确的手机 / 平板 UA + 窄屏」才启用移动端布局（<html class="is-mobile">）。
   其余情况一律按电脑端处理（加 is-pc），页面样式与交互完全保持原样。
   注意：这里刻意不看触屏能力（navigator.maxTouchPoints），也不把 MicroMessenger 认成手机 ——
   带触摸屏的 Windows 笔记本、微信电脑版都会命中，会把电脑端误判成手机端，必须排除。
   放在 head 里提前执行，避免首屏先按电脑布局渲染再跳变。 */
(function () {
  var UA_MOBILE = /Android|iPhone|iPod|iPad|Windows Phone|HarmonyOS|Mobile\//i
    .test(navigator.userAgent);
  var mqNarrow = window.matchMedia ? window.matchMedia('(max-width: 900px)') : null;
  function sync() {
    var narrow = !mqNarrow || mqNarrow.matches;
    var mobile = UA_MOBILE && narrow;
    document.documentElement.classList.toggle('is-mobile', mobile);
    document.documentElement.classList.toggle('is-pc', !mobile);
  }
  sync();
  if (mqNarrow && mqNarrow.addEventListener) mqNarrow.addEventListener('change', sync);
  window.addEventListener('orientationchange', function () { setTimeout(sync, 200); });
})();
</script>
<title>游玩打卡点</title>
<link rel="stylesheet" href="/island/island.css">
<style>
  /* 本页是露营地图的第二个子页面：展示数据库里「游玩打卡」分类的那批点位
     （与全岛地图页读的是同一份数据，不用另外录入）。
     露营点图层（含城市 / 机场地标）在这里不加载，画面上只有游玩打卡点。
     样式沿用第一页的浅蓝底色与纯文字浮层，带 camp__ 前缀，互不干扰。 */
  body { background: #edf3fb; }
  .camp {
    position: relative; height: 100vh; overflow: hidden;
    background: radial-gradient(130% 95% at 50% 5%, #c9ddf4 0%, #d6e6f8 45%, #e3eefa 100%);
  }
  .camp > .map { position: relative; z-index: 1; width: 100%; height: 100%; }

  /* 语言切换：与主站同款的 .lang / .lang-opt 样式由 island.css 统一提供（右上角控件组内） */

  /* 打卡点详情：页面最右下角，纯文字右对齐 */
  .camp__detail {
    position: absolute; right: 18px; bottom: 16px; z-index: 2;
    max-width: 44vw; text-align: right;
    font-size: 12.5px; color: #8a94a6; line-height: 1.7;
    pointer-events: none;
  }
  .camp__kind { font-size: 12px; font-weight: 700; color: #9a8b00; }
  .camp__name { margin: 2px 0 0; font-size: 16px; font-weight: 700; color: #1f2d3d; line-height: 1.45; }
  .camp__intro { margin: 4px 0 0; font-size: 12.5px; color: #4a5260; white-space: pre-wrap; }
  .camp__coords { margin: 4px 0 0; font-size: 12px; color: #8a94a6; }

  /* 未选中时的引导文字：与第一页完全同一套特效 ——
     高亮亮蓝文字 + 轻微半透明深色底衬（磨砂玻璃感），一道柔和高光缓慢横向掠过。
     文字本体大小 / 位置全程固定，不缩放、不做整体透明度闪烁，只靠光带移动吸引注意。
     注意：这里刻意不写 position —— 由基类 .camp__detail 的 absolute 把它钉在右下角。 */
  .camp__detail--hint {
    overflow: hidden;
    padding: 8px 15px; border-radius: 10px;
    background: rgba(18, 32, 52, .55);
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    box-shadow: 0 8px 22px rgba(18, 32, 52, .18);
    font-size: 13.5px; font-weight: 700; color: #9ecbff;
  }
  /* 高光带：只在底衬内部移动，不碰文字，因此文字始终纹丝不动 */
  .camp__detail--hint::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 45%;
    background: linear-gradient(100deg,
      rgba(255,255,255,0) 0%, rgba(255,255,255,.42) 50%, rgba(255,255,255,0) 100%);
    pointer-events: none;
    animation: campHintSweep 3.6s ease-in-out infinite;
  }
  @keyframes campHintSweep {
    0%,  10%  { transform: translateX(-130%); }   /* 停在左侧（不可见）稍作停顿 */
    60%, 100% { transform: translateX(330%);  }   /* 缓慢掠过后停在右侧（不可见） */
  }

  /* 露营点专属印记：详情框里那条紫色类型名 */
  .camp__kind--camp { color: #7b4bc4; }

  /* 左下角：已多选的游玩打卡点（可单个取消，也可一键清空） */
  .camp__picked { position: absolute; left: 18px; bottom: 16px; z-index: 3; max-width: 40vw; }
  .camp__picked-hd { font-size: 12.5px; font-weight: 700; color: #1f2d3d; }
  .camp__picked-hd b { color: #e0492f; font-size: 14px; }
  .camp__picked-tip { margin-top: 3px; font-size: 11.5px; color: #8a94a6; line-height: 1.5; }
  .camp__chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .camp__chip {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid #f2cbc3; background: #fff6f3; color: #c5402a;
    border-radius: 999px; padding: 3px 9px;
    font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .camp__chip:hover { background: #ffe9e3; }
  .camp__chip i { font-style: normal; font-weight: 700; }
  .camp__chip--clear { border-color: #dde5f0; background: #f4f7fc; color: #5a6a82; }

  /* 行程信息卡（称呼 / 联系方式 / 备注）：已按需求隐藏，不再展示也不收集游客联系方式 */
  .camp__form { display: none; }

  /* 出行方式操作区：免拼 / 拼团 两张独立方案卡上下排布，各自带价格明细与主按钮，
     整体固定在页面右侧垂直居中。未选中打卡点时按钮禁用（灰显），选中即启用。 */
  .camp__cta {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%); z-index: 6;
    width: 248px; text-align: center;
  }
  .camp__plan {
    background: rgba(255,255,255,.92); border-radius: 14px;
    padding: 10px 12px 12px; box-shadow: 0 8px 22px rgba(18,32,52,.12);
    text-align: left;
  }
  .camp__plan + .camp__plan { margin-top: 10px; }
  .camp__plan-hd { font-size: 12.5px; font-weight: 700; color: #1f2d3d; }
  /* 确认前的行程区：与方案卡同款白卡，内放人数行 + 确定按钮；
     价格方案卡默认隐藏，点「确定」后才切换到方案区 */
  .camp__confirm {
    background: rgba(255,255,255,.92); border-radius: 14px;
    padding: 10px 12px 12px; box-shadow: 0 8px 22px rgba(18,32,52,.12);
    text-align: left;
  }
  .camp__people-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 700; color: #1f2d3d; min-height: 22px;
  }
  .camp__people-row .camp__cta-edit { margin-top: 0; }
  #ctaPlans[hidden], #ctaConfirm[hidden] { display: none; }
  /* 免拼车型列表：每个车型一行（车型名 + 乘客上限 + 整车价），点击选择；
     坐不下的车型置灰不可选，当前选中项蓝框高亮，推荐车型带小徽标 */
  .camp__seats { margin-top: 7px; display: flex; flex-direction: column; gap: 5px; }
  .camp__seat {
    display: flex; align-items: center; gap: 6px;
    border: 1.5px solid #e2e9f2; border-radius: 9px; background: #fbfdff;
    padding: 5px 8px; font: inherit; font-size: 12px; color: #4c5a70; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .camp__seat b { font-weight: 700; color: #1f2d3d; }
  .camp__seat .cap { font-size: 10.5px; color: #a8b0bd; }
  .camp__seat .rec {
    font-style: normal; font-size: 9.5px; font-weight: 700; color: #2f7cf6;
    border: 1px solid #bcd6fb; border-radius: 999px; padding: 0 5px; line-height: 1.6;
  }
  .camp__seat .pr { margin-left: auto; font-weight: 700; color: #e0492f; white-space: nowrap; }
  .camp__seat.on { border-color: #2f7cf6; background: #f2f7ff; }
  .camp__seat.off { opacity: .42; cursor: not-allowed; }
  /* 拼团价格明细：单人价 + 按当前人数自动算出的总价 */
  .camp__plan-price { margin-top: 7px; font-size: 12px; color: #4c5a70; line-height: 1.75; }
  .camp__plan-price b { font-weight: 700; color: #e0492f; }
  .camp__plan-price .dim { color: #a8b0bd; font-size: 11px; }
  .camp__cta-btn {
    width: 100%; margin-top: 9px; height: 38px; padding: 0 6px;
    border: 0; border-radius: 999px;
    background: #2f7cf6; color: #fff;
    font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 24px rgba(47,124,246,.3);
    transition: background .18s ease, box-shadow .18s ease;
    white-space: nowrap;
  }
  .camp__cta-btn:hover:not(:disabled) { background: #2a6ee0; }
  .camp__cta-btn:disabled { background: #b8c4d4; box-shadow: none; cursor: not-allowed; }
  /* 价格下方辅助提示：字号更小、浅灰，说明不必一次选太多打卡点 */
  .camp__cta-hint {
    margin-top: 6px; font-size: 10.5px; color: #a8b0bd; line-height: 1.55;
  }
  /* 修改人数小入口：不强制二次填写，只是给中途想改的人一个轻量出口 */
  .camp__cta-edit {
    margin-top: 5px; padding: 2px 6px; border: 0; background: none;
    font: inherit; font-size: 11.5px; color: #2f7cf6; cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .camp__cta-edit:hover { color: #2a6ee0; }
  .camp__cta-edit[hidden] { display: none; }

  /* 人数弹窗：点「免拼 / 拼团」后弹出，填 1-9 的整数人数，确认即提交；
     超过 9 人提示联系客服定制 */
  .camp-people-mask {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(18, 32, 52, .45);
    display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .camp-people-mask[hidden] { display: none; }
  .camp-people {
    width: min(320px, 86vw); background: #fff; border-radius: 16px;
    padding: 22px 20px 18px; box-shadow: 0 18px 50px rgba(18, 32, 52, .3);
  }
  .camp-people__title { font-size: 15px; font-weight: 700; color: #1f2d3d; }
  .camp-people__tip { margin-top: 6px; font-size: 12px; color: #8a94a6; line-height: 1.6; }
  .camp-people__input {
    margin-top: 12px; width: 100%; box-sizing: border-box;
    height: 42px; padding: 0 14px; font: inherit; font-size: 15px;
    border: 1.5px solid #dde5f0; border-radius: 10px; outline: none;
  }
  .camp-people__input:focus { border-color: #2f7cf6; }
  .camp-people__err { min-height: 18px; margin-top: 6px; font-size: 12px; color: #e0492f; }
  .camp-people__btns { display: flex; gap: 10px; margin-top: 4px; }
  .camp-people__btn {
    flex: 1; height: 40px; border: 0; border-radius: 999px;
    font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .camp-people__btn--ok { background: #2f7cf6; color: #fff; }
  .camp-people__btn--ok:hover { background: #2a6ee0; }
  .camp-people__btn--cancel { background: #f4f7fc; color: #5a6a82; }

  /* 底部信息卡占位：把左下「已选」与右下「详情」整体上移，避免互相遮挡 */
  .camp__picked, .camp__detail { bottom: 112px; }

  @media (max-width: 820px) {
    .camp__picked, .camp__detail { bottom: 176px; max-width: 64vw; }
    .camp__cta { width: 216px; }
    .camp__cta-btn { font-size: 12.5px; }
  }

  /* 顶部文字区包裹层：电脑端不生成盒子（display:contents），
     head / detail 的绝对定位与原有页面完全一致，PC 表现零变化 */
  .camp__top { display: contents; }

  /* ==================================================================
     移动端专用布局（仅 <html class="is-mobile"> 且视口 ≤ 900px 时生效）
     铁律：地图满铺全屏、视觉零遮挡；所有 UI 组件一律放到屏幕边角，
     严禁出现在地图正中央 / 正上方。
     布局分配：
       左上角：返回小胶囊       右上角：语言切换小胶囊
       左下角：点位详情（毛玻璃卡）
       右侧窄侧边栏：已选 chip + 人数行 + 确定按钮 / 方案卡（毛玻璃）
       「确定」实色突出，其余全部半透明毛玻璃。
     ================================================================== */
  @media (max-width: 900px) {

  /* 地图满铺整个视口，没有任何 inset 留白 */
  .is-mobile .camp { height: 100vh; height: 100dvh; overflow: hidden; }
  .is-mobile .map {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }

  /* 顶部控件：返回/语言 各自成小胶囊贴在两角，容器不吃触摸 */
  .is-mobile .island-top {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0; background: none; box-shadow: none;
    pointer-events: none;
  }
  .is-mobile .lang { gap: 4px; }
  .is-mobile .lang-opt {
    height: 32px; padding: 0 11px; font-size: 11.5px; border-radius: 999px;
    background: rgba(255, 255, 255, .55);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 2px 10px rgba(18, 32, 52, .12);
    border: 1px solid rgba(255, 255, 255, .5);
    pointer-events: auto;
  }
  .is-mobile .island-back {
    height: 32px; padding: 0 12px; font-size: 11.5px; border-radius: 999px;
    background: rgba(255, 255, 255, .55);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 2px 10px rgba(18, 32, 52, .12);
    border: 1px solid rgba(255, 255, 255, .5);
    pointer-events: auto;
  }

  /* 顶部文字区包裹层不生成盒子 */
  .is-mobile .camp__top { display: contents; }
  .is-mobile .camp__panel { display: contents; }

  /* 点位详情 / 未选提示：【左下角】毛玻璃小卡，宽度严格受限，
     与右下侧边栏（宽 ≤ 52vw）之间预留充足间距，确保两者互不重叠 */
  .is-mobile .camp__detail {
    position: absolute; left: 10px; bottom: 10px; z-index: 6;
    top: auto; right: auto;
    max-width: min(180px, 38vw); text-align: left;
    font-size: 10.5px; line-height: 1.5;
    background: rgba(255, 255, 255, .5);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, .55);
    border-radius: 10px; padding: 6px 9px;
    box-shadow: 0 4px 16px rgba(18, 32, 52, .1);
    pointer-events: none;
  }
  .is-mobile .camp__kind { font-size: 10px; }
  .is-mobile .camp__name { font-size: 12px; }
  .is-mobile .camp__intro { font-size: 10.5px; }
  .is-mobile .camp__coords { font-size: 10px; }
  /* 未选提示：左下角小卡，扫光动画保留，字号收紧 */
  .is-mobile .camp__detail--hint {
    padding: 7px 11px; font-size: 11.5px;
    background: rgba(18, 32, 52, .42);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, .18);
  }

  /* 已选打卡点：并入右侧侧边栏上方（视觉在侧边栏顶），chip 可点 */
  .is-mobile .camp__picked {
    position: absolute;
    right: 12px; bottom: calc(var(--sideH, 220px) + 12px);
    z-index: 6;
    left: auto; top: auto;
    max-width: min(200px, 50vw); margin: 0; padding: 0;
    background: none; box-shadow: none;
    max-height: 18vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    pointer-events: none;
  }
  .is-mobile .camp__picked-hd {
    font-size: 11px; text-align: right;
    color: #1f2d3d;
    text-shadow: 0 1px 3px rgba(255,255,255,.9), 0 0 6px rgba(255,255,255,.6);
  }
  .is-mobile .camp__picked-tip { display: none; }
  .is-mobile .camp__picked.is-empty { display: none; }
  .is-mobile .camp__chips {
    display: flex; flex-direction: column; gap: 4px;
    align-items: flex-end;
    overflow-x: hidden; overflow-y: visible;
    margin-top: 4px; padding-bottom: 0;
  }
  .is-mobile .camp__chip {
    flex: 0 0 auto; font-size: 11px;
    background: rgba(255, 255, 255, .6);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, .6);
    pointer-events: auto;
  }
  .is-mobile .camp__chip--clear { background: rgba(244, 247, 252, .6); }

  /* 出行方式面板：【右下角窄侧边栏】毛玻璃，宽度固定不占满底部 */
  .is-mobile .camp__cta {
    position: absolute;
    right: 12px; bottom: 12px;
    left: auto; top: auto;
    transform: none; width: min(200px, 52vw); text-align: left;
    background: rgba(255, 255, 255, .55);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .6);
    border-radius: 14px; padding: 10px 11px;
    box-shadow: 0 8px 22px rgba(18, 32, 52, .14);
    pointer-events: none;
  }
  .is-mobile .camp__plan, .is-mobile .camp__confirm { background: none; box-shadow: none; border-radius: 0; padding: 0; }
  .is-mobile .camp__plan + .camp__plan {
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(0, 0, 0, .12);
  }
  /* 车型列表：窄栏里改为竖排，每个车型一行 */
  .is-mobile .camp__seats {
    flex-direction: column; gap: 4px; margin-top: 5px;
  }
  .is-mobile .camp__seat {
    flex: 0 0 auto; flex-direction: row; align-items: center;
    padding: 6px 8px; text-align: left;
    background: rgba(255, 255, 255, .5);
    border: 1.5px solid rgba(255, 255, 255, .5);
    border-radius: 9px;
    pointer-events: auto;
  }
  .is-mobile .camp__seat.on {
    border-color: #2f7cf6;
    background: rgba(242, 247, 255, .85);
  }
  .is-mobile .camp__seat .pr { margin-left: auto; }
  /* 确定按钮：实色不透明，在侧边栏里 */
  .is-mobile .camp__cta-btn {
    width: 100%; height: 40px; margin-top: 6px; font-size: 13px;
    white-space: normal; line-height: 1.2;
    background: #2f7cf6; opacity: 1;
    box-shadow: 0 4px 12px rgba(47, 124, 246, .3);
    pointer-events: auto;
  }
  .is-mobile .camp__cta-btn:disabled { background: #b8c4d4; box-shadow: none; }
  .is-mobile .camp__plan-price { font-size: 11px; margin-top: 4px; }
  .is-mobile .camp__cta-hint {
    margin-top: 3px; font-size: 10px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; color: #4c5a70;
  }
  .is-mobile .camp__cta-edit {
    margin-top: 2px; font-size: 11px;
    background: none; padding: 0;
    pointer-events: auto;
  }

  /* 人数弹窗：模态交互时，毛玻璃弹窗居中（用户主动触发的临时聚焦） */
  .is-mobile .camp-people-mask {
    background: rgba(18, 32, 52, .28);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .is-mobile .camp-people {
    background: rgba(255, 255, 255, .82);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, .6);
    padding: 18px 16px 14px;
  }
  .is-mobile .camp-people__btn { height: 44px; font-size: 13px; }
  .is-mobile .camp-people__btn--ok { background: #2f7cf6; }
  .is-mobile .camp-people__input { height: 46px; font-size: 16px; background: rgba(255, 255, 255, .8); }

  /* ==================================================================
     移动端按钮通用约束：所有可点控件之间必须有清晰间距，不允许重叠；
     文字过长时优先缩字号（而非撑大按钮），保证每个按钮独立可点。
     ================================================================== */
  .is-mobile button, .is-mobile .camp__chip, .is-mobile .camp__seat,

  <div class="camp__panel">

       电脑端这个包裹层用 display:contents（不生成盒子），详情仍钉在右下角；
       移动端则排进底部面板。 -->
  <div class="camp__top">
    <!-- 打卡点详情：点击地图上的标记后显示（电脑端在右下角，移动端在面板内） -->
    <div class="camp__detail" id="campDetail"></div>
  </div>

  <!-- 已选游玩打卡点：支持多选，点标签上的 × 可单个取消 -->
  <div class="camp__picked" id="campPicked"></div>

  <!-- 行程信息卡：按需求隐藏，不再收集游客联系方式 -->
  <div class="camp__form" id="campForm"></div>

  <!-- 出行方式两套方案独立成卡：免拼（包车，按车型整车价，坐不下的车型置灰不可选）
       与拼团（按人头，单人价 × 当前人数自动算总价），游客可清晰对比两套价格。
       方案区默认隐藏 —— 游客先选打卡点、确认出行人数，点「确定」后才展示价格方案，

  <div class="camp__cta" id="campCta">

    <div class="camp__confirm" id="ctaConfirm">

      <button type="button" class="camp__cta-btn" id="ctaGo" disabled></button>

    <div id="ctaPlans" hidden>

      </div>
    </div>
    <div class="camp__cta-hint" id="ctaHint"></div>
    <button type="button" class="camp__cta-edit" id="ctaEdit" hidden></button>
  </div>
  </div><!-- /.camp__panel -->

  <!-- 人数弹窗：仅在第一步未填人数（如直接从地址打开本页）或点「修改人数」时出现 -->
  <div class="camp-people-mask" id="peopleMask" hidden>

  /* 推荐车型：当前人数能坐下的最小车型；人数未知或 9 人（超出上限）返回 0 */
  function recVehicle() {
    if (people < 1) return 0;
    for (var i = 0; i < VEHICLES.length; i++) if (VEHICLES[i].cap >= people) return VEHICLES[i].seats;

  /* 人数变化后校验已选车型：坐不下（或未选）时改挂推荐车型；人数未知时保留用户手选 */
  function ensureVehicle() {
    if (people < 1) return;
    var cur = null;
    for (var i = 0; i < VEHICLES.length; i++) if (VEHICLES[i].seats === vehSeat) cur = VEHICLES[i];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {

  function pick(i18n, fallback) {

  /* 未选中的打卡点分类 key，同时也是「挂呼吸光晕」的那一层 */
  function playKey() { return (kind && kind.key) || 'play'; }

  function mapCategories() {
    return [
      /* 待点击：细描边的小黄点，外圈由 __halo__ 系列叠一圈呼吸光晕，暗示「这个可以点」 */
      { key: playKey(), name: (kind && kind.name) || t().kindFallback,
        color: (kind && kind.color) || '#d2cc1e',
        symbol: (kind && kind.symbol) || 'circle',
        symbolSize: (kind && kind.symbolSize) || 14, z: 20 },
      /* 已选中：比黄点大一圈、粗白描边 + 重投影的红色徽章，完全静止 ——
         与「会呼吸的小黄点」在静止画面里也一眼分得开（第一页同一套两态设计）。 */
      { key: PLAY_SEL_KEY, name: t().selLabel, color: PLAY_SEL_COLOR,
        symbol: 'circle', symbolSize: 24, z: 26,
        borderColor: '#fff', borderWidth: 3.5, shadowBlur: 14,
        shadowColor: 'rgba(224,73,47,.45)' }
    ];
  }
  function mapPoints() {

         确保地图组件（map.js）里标签/提示都拿到翻译后的名称 */
      var nm = spotName(s);

        _raw: s
      };

      key: CAMP_KEY,
      name: t().campLabel,
      color: CAMP_COLOR,
      symbol: 'pin',
      symbolSize: 46,
      z: 32,
      points: [{
        id: campSite.id,
        name: pick(campSite.names, campSite.name) || t().campLabel,
        lng: +campSite.lng,
        lat: +campSite.lat
      }]
    }];
  }

  /* 悬浮提示：默认提示是固定的中文，这里按当前语种覆盖成打卡点的名称与简介 */
  function applyTooltip() {
    if (!map || !map.chart) return;
    map.chart.setOption({
      tooltip: {
        formatter: function (pp) {
          var d = pp.data || {};
          if (d.kind === 'bubble' || d.kind === 'collapse' || d.kind === 'route') return '';
          if (d.cluster) return '';
          if (pp.componentType === 'geo') return '';
          var r = d.raw || {};
          /* 露营点走地标层，它的名称放在 raw 里，series 的 name 是分组名 */
          var nm = (d.landmark && r.name) || d.name || t().unnamed;
          var intro = d.landmark ? '' : pick(r.intro, '');
          return '<b>' + esc(nm) + '</b>' +
                 (intro ? '<br><span style="opacity:.78">' + esc(intro) + '</span>' : '');
        }
      }
    });
  }

  function refreshMap() {
    if (!map) return;
    map.update({ categories: mapCategories(), points: mapPoints(), landmarks: campLandmarks() });
    applyTooltip();
  }
  /* 多选状态变了：重画地图 + 刷新左下角已选清单 + 同步提交按钮可用态 */
  function redraw() { refreshMap(); renderPicked(); syncSubmit(); }
  function selectSpot(id) { if (!isSel(id)) selIds.push(id); redraw(); }
  function unselectSpot(id) {
    var i = selIds.indexOf(id);
    if (i >= 0) selIds.splice(i, 1);
    redraw();
  }
  function toggleSpot(id) { if (isSel(id)) unselectSpot(id); else selectSpot(id); }

  /* 按钮可用态：选中至少一个打卡点即启用「确定」与两个方案按钮（提交中保持禁用）。
     人数超出全部车型上限（9 人）时免拼不可提交，只能拼团或联系客服定制 */
  function syncSubmit() {
    var busy = !!$('ctaPrivate').dataset.busy;
    var off = busy || !selIds.length;
    $('ctaGo').disabled = off;
    $('ctaPrivate').disabled = off || (people > 0 && recVehicle() === 0);
    $('ctaShared').disabled = off;
  }

  /* 价格方案区显隐：默认隐藏（只留人数行 + 确定按钮 + 提示），点「确定」后切换到两套方案卡 */
  function showPlans(on) {
    plansShown = on !== false;
    $('ctaPlans').hidden = !plansShown;
    $('ctaConfirm').hidden = plansShown;
    renderPeopleEntry();
    syncSubmit();
    syncCtaHeight();
  }

  /* 移动端：右侧侧边栏高度写入 --sideH，已选 chip 区贴在侧边栏顶之上 */
  function syncCtaHeight() {
    var cta = document.querySelector('.camp__cta');
    if (!cta) return;
    var h = cta.getBoundingClientRect().height;
    document.documentElement.style.setProperty('--sideH', Math.round(h) + 'px');
  }
  window.addEventListener('resize', syncCtaHeight);
  window.addEventListener('orientationchange', function(){ setTimeout(syncCtaHeight, 250); });

  /* 两个方案卡的价格明细：免拼列出 4/7/9 座整车价（坐不下的置灰、推荐的带徽标），
     拼团显示单人价 + 按当前人数算出的总价；后台未配置（0）的项占位展示 */
  function renderPlans() {
    var d = t();
    $('planPrivateHd').textContent = d.planPrivateHd;
    $('planSharedHd').textContent = d.planSharedHd;
    var rec = recVehicle();
    var html = '';
    VEHICLES.forEach(function (v) {
      var fit = vehFits(v);
      var price = pricing.private['seat' + v.seats] || 0;
      html += '<button type="button" class="camp__seat' +
        (vehSeat === v.seats ? ' on' : '') + (fit ? '' : ' off') +
        '" data-seat="' + v.seats + '"' + (fit ? '' : ' disabled') + '>' +
        '<b>' + esc(d.seatName(v.seats)) + '</b>' +
        '<span class="cap">' + esc(d.seatCap(v.cap)) + '</span>' +
        (rec === v.seats ? '<i class="rec">' + esc(d.rec) + '</i>' : '') +
        '<span class="pr">' + (price > 0 ? '¥' + price : '—') + '</span>' +
      '</button>';
    });
    $('planSeats').innerHTML = html;
    Array.prototype.forEach.call($('planSeats').querySelectorAll('[data-seat]'), function (b) {
      b.onclick = function () {
        if (b.disabled) return;
        vehSeat = +b.dataset.seat;
        renderPlans();
      };
    });
    var per = pricing.shared || 0;
    if (per > 0) {
      $('planSharedPrice').innerHTML =
        '<div>' + esc(d.perPerson) + ' <b>¥' + per + '</b></div>' +
        (people > 0
          ? '<div>' + esc(d.totalFor(people)) + ' <b>¥' + (per * people) + '</b></div>'
          : '<div class="dim">' + esc(d.totalPending) + '</div>');
    } else {
      $('planSharedPrice').innerHTML = '<div class="dim">' + esc(d.priceUnset) + '</div>';
    }
  }

  function findSpot(id) {
    for (var i = 0; i < spots.length; i++) if (spots[i].id === id) return spots[i];
    return null;
  }
  /* 右下角详情：显示最近点过的那个标记（露营点或游玩打卡点） */
  function renderDetail() {
    var box = $('campDetail');
    if (campSite && detailId === campSite.id) {           /* 上一步选中的露营点 */
      box.className = 'camp__detail';                     /* 有内容：去掉引导态，恢复正常文字样式 */
      box.innerHTML =
        '<div class="camp__kind camp__kind--camp">' + esc(t().campLabel) + '</div>' +
        '<div class="camp__name">' + esc(pick(campSite.names, campSite.name)) + '</div>' +
        '<div class="camp__coords">' + esc(t().coords) + ' ' +
          (+campSite.lng).toFixed(5) + ', ' + (+campSite.lat).toFixed(5) + '</div>';
      return;
    }
    var s = findSpot(detailId);
    if (!s) {
      /* 还没有点过：给一行带扫光的引导文字（与第一页同一套特效）。
         库里一个打卡点都没有时是「无数据」提示，不长成引导气泡。 */
      if (!spots.length) {
        box.className = 'camp__detail';
        box.textContent = t().empty;
        return;
      }
      box.className = 'camp__detail camp__detail--hint';
      box.textContent = t().hint;
      return;
    }
    box.className = 'camp__detail';
    var intro = pick(s.intro, '');
    box.innerHTML =
      '<div class="camp__kind">' + esc(t().kindLabel) + '</div>' +
      '<div class="camp__name">' + esc(spotName(s)) + '</div>' +
      (intro ? '<div class="camp__intro">' + esc(intro) + '</div>'
             : '<div class="camp__intro" style="color:#a2abb9">' + esc(t().noIntro) + '</div>') +
      '<div class="camp__coords">' + esc(t().coords) + ' ' + (+s.lng).toFixed(5) + ', ' + (+s.lat).toFixed(5) + '</div>';
  }

  /* 左下角：已多选的游玩打卡点清单（点标签可单个取消，另有清空） */
  function renderPicked() {
    var box = $('campPicked');
    if (!selIds.length) {
      /* 移动端把「已选」做成底部面板的一条，没有选中项时整条隐藏，不占位置 */
      box.classList.add('is-empty');
      box.innerHTML = '<div class="camp__picked-tip">' + esc(t().pickedNone) + '</div>';
      return;
    }
    box.classList.remove('is-empty');
    var chips = selIds.map(function (id) {
      var s = findSpot(id);
      return '<button type="button" class="camp__chip" data-off="' + esc(id) + '">' +
             esc(s ? spotName(s) : t().unnamed) + '<i>&times;</i></button>';
    }).join('');

    box.innerHTML =
      '<div class="camp__picked-hd">' + t().pickedHd(selIds.length) + '</div>' +
      '<div class="camp__chips">' + chips +
        '<button type="button" class="camp__chip camp__chip--clear" data-off="">' +
        esc(t().clearAll) + '</button>' +
      '</div>' +
      '<div class="camp__picked-tip">' + esc(t().pickedTip) + '</div>';

    Array.prototype.forEach.call(box.querySelectorAll('[data-off]'), function (b) {
      b.onclick = function () {
        var id = b.dataset.off;
        if (id) unselectSpot(id);
        else { selIds = []; redraw(); }          /* 清空 */
      };
    });
  }

  /* 切换语种：页内文字 + 顶部说明 + 详情 + 地图标签（含悬浮提示）全部同步刷新 */
  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    document.title = t().title;
    Array.prototype.forEach.call($('campLangs').children, function (b) {
      b.classList.toggle('active', b.dataset.lang === lang);   /* 选中项高亮：与主站语言切换同款 */
    });
    $('campBack').textContent = t().back;          /* 返回首页入口文字跟随语种 */
    renderForm();                                  /* 行程信息卡：标题 / 输入提示 / 按钮文字跟随语种 */
    renderDetail();
    renderPicked();
    refreshMap();
  }
  function setLang(next) {
    if (LANGS.indexOf(next) < 0) next = 'zh';
    lang = next;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLang();
    /* 语言换行可能改变底部条高度 → 重新同步地图底部留白 */
    setTimeout(syncCtaHeight, 0);
  }
  Array.prototype.forEach.call($('campLangs').children, function (b) {
    b.onclick = function () { setLang(b.dataset.lang); };
  });

  /* ---------- 出行方式 + 人数 + 提交 ----------
     右侧「免拼 / 拼团」二选一。人数已在第一步地图页填写并全局缓存（localStorage），
     这里点按钮直接沿用该人数提交，不再弹出输入框；只有缓存为空（直接从地址
     打开本页）才回退到弹窗，另外提供「修改人数」小入口供中途调整。
     提交体带选中的点位 ID + 出行方式 + 人数，后台按「点位ID + 方式 + 人数 +
     当前打卡时间」记录，不收集游客称呼或联系方式。 */
  function renderForm() {
    var d = t();
    $('ctaPrivate').textContent = d.tourPrivate;
    $('ctaShared').textContent = d.tourShared;
    $('peopleTip').textContent = d.peopleTip;
    $('peopleInput').placeholder = d.peoplePh;
    $('peopleCancel').textContent = d.peopleCancel;
    $('ctaHint').textContent = d.ctaHint;      /* 方案卡下方辅助提示：跟随语种 */
    $('ctaGo').textContent = d.confirmGo;      /* 「确定」按钮：确认行程后展示价格方案 */
    renderPlans();
    renderPeopleEntry();
  }
  /* 人数入口：状态 A 在确认卡内显示人数行（已填：人数 + 修改入口；未填：填写按钮）；
     状态 B 保留方案卡下方的「修改人数」小入口 */
  function renderPeopleEntry() {
    var d = t();
    var row = $('ctaPeopleRow');
    if (people > 0) {
      row.innerHTML = esc(d.peopleCurrent(people)) +
        ' <button type="button" class="camp__cta-edit" id="ctaPeopleEdit">' + esc(d.peopleEdit) + '</button>';
    } else {
      row.innerHTML = '<button type="button" class="camp__cta-edit" id="ctaPeopleFill">' +
        esc(d.peopleFill) + '</button>';
    }
    var rowBtn = row.querySelector('button');
    if (rowBtn) rowBtn.onclick = function () { openPeople(true); };
    var btn = $('ctaEdit');
    if (plansShown && people > 0) {
      btn.hidden = false;
      btn.textContent = d.peopleCurrent(people) + ' · ' + d.peopleEdit;
    } else {
      btn.hidden = true;
    }
  }
  /* 弹窗：editing = true 表示只是修改人数（不提交）；否则是第一步没填人的兜底 */
  var peopleOpenedAt = 0;
  /* 弹窗显隐统一走这里：hidden 属性 + 内联 display 双保险。
     .camp-people-mask 自身是 display:flex，若环境里 [hidden] 规则没生效，
     全屏遮罩会一直盖住页面，表现为「点按钮没反应 / 地图点不动」。 */
  function showPeopleMask(on) {
    var m = $('peopleMask');
    m.hidden = !on;
    m.style.display = on ? 'flex' : 'none';
  }
  function openPeople(editing) {
    editingPeople = !!editing;
    var d = t();
    $('peopleTitle').textContent = editingPeople ? d.peopleEditTitle : d.peopleTitle;
    $('peopleInput').value = people > 0 ? people : '';
    $('peopleOk').textContent = editingPeople ? d.peopleSave : d.peopleOk;
    $('peopleErr').textContent = '';
    peopleOpenedAt = Date.now();
    showPeopleMask(true);
    setTimeout(function () { $('peopleInput').focus(); }, 30);
  }
  function closePeople() { showPeopleMask(false); }
  /* 弹窗确认：校验 1-9 整数人数并写入全局缓存；修改模式只保存，否则直接提交 */
  function confirmPeople() {
    var d = t();
    var raw = $('peopleInput').value.trim();
    if (!raw) { $('peopleErr').textContent = d.peopleErrEmpty; return; }
    if (!/^\d+$/.test(raw)) { $('peopleErr').textContent = d.peopleErrRange; return; }
    var n = parseInt(raw, 10);
    if (n < 1) { $('peopleErr').textContent = d.peopleErrRange; return; }
    if (n > 9) { $('peopleErr').textContent = d.peopleOver; return; }
    people = n;
    try { localStorage.setItem(PEOPLE_KEY, String(n)); } catch (e) {}   /* 与第一步共用同一份缓存 */
    closePeople();
    ensureVehicle();          /* 人数变了：已选车型坐不下时改挂推荐车型 */
    renderPlans();            /* 车型置灰态与拼团总价都随人数刷新 */
    syncSubmit();             /* 9 人无适配车型时免拼按钮随之禁用 */
    renderPeopleEntry();
    /* 非修改模式（点「确定」时人数未填的兜底）：人数补齐后展示两套价格方案，不直接提交 */
    if (!editingPeople) showPlans();
  }
  /* 「确定」按钮：确认已选打卡点与人数后，才展示免拼 / 拼团两套价格方案 */
  $('ctaGo').onclick = function () {
    if (this.disabled) return;
    if (!campSite) { alert(t().needCamp); return; }
    if (!selIds.length) { alert(t().needSpot); return; }
    if (people < 1) { openPeople(false); return; }   /* 先补人数，确认后自动进入方案区 */
    showPlans();
  };
  /* 点免拼 / 拼团：已有缓存人数则直接提交，跳过二次填写 */
  function pickTour(type) {
    if (!campSite) { alert(t().needCamp); return; }
    if (!selIds.length) { alert(t().needSpot); return; }
    tourType = type;
    if (type === 'private') ensureVehicle();   /* 免拼带上当前选中（或推荐）车型 */
    if (people > 0) { doSubmit(); return; }
    openPeople(false);                 /* 仅兜底：第一步没填人数时 */
  }
  $('ctaPrivate').onclick = function () {
    if (this.disabled || this.dataset.busy) return;
    pickTour('private');
  };
  $('ctaShared').onclick = function () {
    if (this.disabled || this.dataset.busy) return;
    pickTour('shared');
  };
  $('ctaEdit').onclick = function () {
    if ($('ctaPrivate').dataset.busy) return;
    openPeople(true);
  };
  $('peopleOk').onclick = confirmPeople;
  $('peopleCancel').onclick = closePeople;
  /* 点遮罩空白处关闭弹窗：刚打开后的 400ms 内忽略，
     避免连点两下按钮时第二下落在遮罩上把弹窗立刻关掉（表现为「点了没弹窗」） */
  $('peopleMask').onclick = function (ev) {
    if (ev.target !== this) return;
    if (Date.now() - peopleOpenedAt < 400) return;
    closePeople();
  };
  $('peopleInput').onkeydown = function (ev) {
    if (ev.key === 'Enter') confirmPeople();
    else if (ev.key === 'Escape') closePeople();
  };

  function doSubmit() {
    var sid = '';
    try { sid = sessionStorage.getItem('beisu_sid') || ''; } catch (e) {}
    if (!sid) {
      sid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('s_' + Date.now());
      try { sessionStorage.setItem('beisu_sid', sid); } catch (e) {}
    }

    $('ctaPrivate').dataset.busy = '1';
    syncSubmit();
    fetch('/api/island/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sessionId: sid, lang: lang,
        camp: { id: campSite.id, name: pick(campSite.names, campSite.name) },
        spots: selIds.slice(),
        tourType: tourType,                /* 出行方式：private 免拼 / shared 拼团 */
        vehicle: tourType === 'private' ? (vehSeat || undefined) : undefined,   /* 免拼所选车型（4/7/9 座） */
        people: people                     /* 弹窗确认的出行人数（1-9） */
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) throw new Error((d && d.error) || '');
        if (d.sid) { try { sessionStorage.setItem('beisu_sid', d.sid); } catch (e) {} }
        location.href = '/';                     /* 回到主站，右侧聊天框同步显示这条行程 */
      })
      .catch(function (e) {
        alert(t().submitFail + (e.message || ''));
        delete $('ctaPrivate').dataset.busy;
        syncSubmit();
      });
  }

  /* 直接向服务端接口取数据（接口读的是本地数据库），不抓取任何网页。
     1) /api/play-points 取「游玩打卡」分类那批点位（与全岛地图页同一份数据）；
     2) 若地址带 ?point=，再从 /api/camp-points 取回上一步选中的露营点，
        在本页用专属紫色印记标出来。 */
  function boot() {
    showPeopleMask(false);                         /* 进页面先确保弹窗关闭，避免全屏遮罩挡住地图与按钮 */
    var saved = '';
    try { saved = localStorage.getItem(LANG_KEY) || ''; } catch (e) {}
    lang = LANGS.indexOf(saved) >= 0 ? saved : 'zh';
    /* 出行人数：沿用第一步地图页写入的全局缓存（1-9 之外的脏值一律视为未填） */
    try {
      var pn = parseInt(localStorage.getItem(PEOPLE_KEY), 10);
      if (pn >= 1 && pn <= 9) people = pn;
    } catch (e) {}
    ensureVehicle();                   /* 缓存人数落地后先定好推荐车型，方案卡随之高亮 */
    applyLang();

    var pid = '';
    try { pid = new URLSearchParams(location.search).get('point') || ''; } catch (e) {}

    /* 报价方案：后台录入的免拼 4/7/9 座整车价 + 拼团单人价，未配置时各项为 0（前端占位展示） */
    fetch('/api/island-config', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (c) {
        var pr = c && c.pricing;
        if (!pr) return;
        var pv = pr.private || {};
        pricing.private = { seat4: +pv.seat4 || 0, seat7: +pv.seat7 || 0, seat9: +pv.seat9 || 0 };
        pricing.shared = +pr.shared || 0;
        renderPlans();
      })
      .catch(function () {});              /* 配置拉取失败不影响页面其余功能 */

    fetch('/api/play-points', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        kind = d.category || null;
        spots = (d.points || []).filter(function (s) {
          return s && isFinite(+s.lng) && isFinite(+s.lat);
        });
        if (!pid) return null;
        return fetch('/api/camp-points', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (c) {
            var arr = c.points || [];
            campSite = arr.filter(function (x) { return x.id === pid; })[0] || null;
          });
      })
      .then(function () {
        /* 只建「游玩打卡点」这一层；上一步选中的露营点作为地标层的专属印记单独绘制 */
        map = window.HainanMap.create($('campMap'), {
          categories: mapCategories(),
          points: mapPoints(),
          landmarks: campLandmarks(),
          roam: true,
          legend: false,
          labelMode: 'always',        /* 打卡点数量不多，名称直接常显 */
          labelKinds: false,
          /* 与第一页同一套两态设计：所有「待点击」的打卡点圆点默认带一圈缓慢呼吸光晕，
             表示「这个可以点」；一旦点中被选中，它就换到红色高亮徽章那一层、光晕自动撤掉。 */
          haloCategory: [playKey()],
          onClick: function (ev) {
            var d2 = ev && ev.data;
            /* 聚合气泡 / 同心环：交给地图自身展开收起，不当作选点 */
            if (!d2 || d2.cluster) return;
            var id = d2.pointId;
            if (!id) return;

            if (d2.landmark) {                  /* 点到露营点专属印记：只出详情，不进多选 */
              detailId = id;
              renderDetail();
              return;
            }
            if (!findSpot(id)) return;
            detailId = id;
            renderDetail();
            toggleSpot(id);                     /* 再点一次即取消，支持连续多选 */
          }
        });
        applyTooltip();
        applyLang();
        syncCtaHeight();     /* 首屏确定条高度写入 --ctaH，地图底部对齐条顶 */

        /* 移动端转屏 / 地址栏伸缩 / 底部面板高度变化后重算地图尺寸，
           保证点位与名称位置正确、不影响选点（电脑端同样安全）。 */
        var onResize = function () {
          syncCtaHeight();
          if (map && map.chart) map.chart.resize();
        };
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', function () { setTimeout(onResize, 250); });
      })
      .catch(function (e) {
        $('campDetail').textContent = t().loadFail + e.message;
      });
  }

  boot();
})();
</script>
</body>
</html>
