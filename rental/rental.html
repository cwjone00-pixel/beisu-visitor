<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>车辆详情</title>
  <style>
    /* ============================================================
       租车行 · 车辆详情页（从地图页点击蓝色租车点位跳转进入）
       ------------------------------------------------------------
       左侧：门店基础信息（门店 / 评分 / 地址 / 电话 / 营业时间），
             位置小地图由服务端代理高德静态图接口生成；
       右侧：按 4 座 / 7 座 / 9 座三个板块列出车型与日租、周租、押金。
       门店信息来自高德接口缓存，车型与价格来自 data/rental-cars.json；
       全部文案支持中文 / English / Русский，切换即时生效。
       ============================================================ */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: radial-gradient(120% 80% at 50% 0%, #dcebfa 0%, #eef4fb 55%, #f4f8fd 100%);
      background-attachment: fixed;
      color: #1f2d3d;
      -webkit-text-size-adjust: 100%;
      min-height: 100vh;
    }

    /* ---------------- 顶部栏 ---------------- */
    .rhead {
      position: sticky; top: 0; z-index: 5;
      background: rgba(255,255,255,.86);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border-bottom: 1px solid #dbe6f5;
    }
    .rhead__inner {
      max-width: 1240px; margin: 0 auto; padding: 12px 20px;
      display: flex; align-items: center; gap: 14px;
    }
    .rhead__back {
      color: #2f6fed; text-decoration: none; font-size: 13px; font-weight: 600;
      white-space: nowrap;
    }
    .rhead__back:hover { text-decoration: underline; }
    .rhead__title { font-size: 14.5px; font-weight: 700; color: #1f2d3d; }
    .rlangs { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .rlangs button {
      border: 0; background: none; padding: 0; font: inherit; font-size: 12.5px;
      color: #6b7a90; cursor: pointer;
    }
    .rlangs button:hover { color: #2f6fed; }
    .rlangs button.on { color: #2f6fed; font-weight: 700; }

    /* ---------------- 主体两栏 ---------------- */
    .rshell {
      max-width: 1240px; margin: 0 auto; padding: 22px 20px 44px;
      display: grid; grid-template-columns: 330px minmax(0, 1fr);
      gap: 22px; align-items: start;
    }

    /* 左侧：门店信息卡 */
    .ragency {
      position: sticky; top: 72px;
      background: #fff; border: 1px solid #dbe6f5; border-radius: 16px;
      padding: 16px; box-shadow: 0 10px 28px rgba(31,45,61,.08);
    }
    .ragency__map {
      position: relative; border-radius: 12px; overflow: hidden;
      background: #e6eef9; aspect-ratio: 600 / 340;
    }
    .ragency__map img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .ragency__maplink {
      position: absolute; right: 8px; bottom: 8px;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,.92);
      font-size: 11.5px; color: #2f6fed; text-decoration: none;
      box-shadow: 0 2px 8px rgba(31,45,61,.16);
    }
    .ragency__name {
      margin: 14px 0 8px; font-size: 17px; font-weight: 700; line-height: 1.45;
    }
    .ragency__meta { display: flex; flex-wrap: wrap; gap: 7px; }
    .rtag {
      display: inline-block; padding: 2px 9px; border-radius: 999px;
      font-size: 11.5px; background: #eef4ff; color: #2f6fed;
    }
    .rtag--rate { background: #fff6e5; color: #b47b12; }

    .rinfo { margin: 14px 0 0; padding: 0; }
    .rinfo__row {
      display: flex; gap: 10px; padding: 7px 0;
      border-top: 1px dashed #e6eef9; font-size: 12.5px; line-height: 1.55;
    }
    .rinfo__row:first-child { border-top: 0; }
    .rinfo dt { flex: 0 0 62px; color: #8a94a6; margin: 0; }
    .rinfo dd { flex: 1; margin: 0; color: #2c3a4d; word-break: break-word; }
    .rinfo dd a { color: #2f6fed; text-decoration: none; }
    .ragency__note {
      margin: 12px 0 0; font-size: 11px; color: #97a1b1; line-height: 1.5;
    }

    /* 右侧：三个座位板块 */
    .rsec {
      background: #fff; border: 1px solid #dbe6f5; border-radius: 16px;
      padding: 16px 18px 18px; box-shadow: 0 8px 24px rgba(31,45,61,.06);
    }
    .rsec + .rsec { margin-top: 18px; }
    .rsec__head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .rsec__seat {
      width: 34px; height: 34px; border-radius: 10px;
      display: grid; place-items: center;
      background: #eaf1ff; color: #2f6fed;
      font-size: 15px; font-weight: 800;
    }
    .rsec__head h2 { margin: 0; font-size: 15px; font-weight: 700; }
    .rsec__count { margin-left: auto; font-size: 12px; color: #8a94a6; }
    .rsec__empty { margin: 0; font-size: 12.5px; color: #97a1b1; }

    /* 配车按钮：本店没有客户想要的车型时，从这里发起调度 */
    .rsec__dispatch {
      margin-left: auto; flex: 0 0 auto;
      border: 1px solid #c9dcff; background: #f2f7ff; color: #2f6fed;
      border-radius: 999px; padding: 5px 13px;
      font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
      white-space: nowrap;
    }
    .rsec__dispatch:hover { background: #e5efff; }
    .rsec__dispatch + .rsec__count { margin-left: 0; }
    .rsec__hint { margin: 8px 0 0; font-size: 11.5px; color: #9aa4b4; line-height: 1.6; }

    /* ---------------- 配车 / 调度弹层 ---------------- */
    .rdlg[hidden] { display: none; }
    .rdlg {
      position: fixed; inset: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .rdlg__mask { position: absolute; inset: 0; background: rgba(23,36,54,.42); }
    .rdlg__panel {
      position: relative; width: 100%; max-width: 560px; max-height: 88vh;
      overflow-y: auto; background: #fff; border-radius: 18px;
      box-shadow: 0 24px 60px rgba(20,35,60,.26);
      padding: 20px 22px 18px;
    }
    .rdlg__close {
      position: absolute; right: 12px; top: 10px; border: 0; background: none;
      font-size: 20px; line-height: 1; color: #b3bccb; cursor: pointer;
    }
    .rdlg__close:hover { color: #2f6fed; }
    .rdlg__title { margin: 0 26px 6px 0; font-size: 17px; font-weight: 700; }
    .rdlg__note {
      margin: 0 0 14px; padding: 9px 12px; border-radius: 10px;
      background: #fff8e8; color: #8a6416; font-size: 12px; line-height: 1.65;
    }
    .rdlg__pick { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: #6b7a90; }
    .rdlg__opts {
      display: grid; gap: 9px; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
    }
    .ropt {
      display: flex; gap: 10px; align-items: center;
      border: 1px solid #e0e9f6; border-radius: 12px; padding: 8px;
      cursor: pointer; background: #fff;
    }
    .ropt.on { border-color: #2f6fed; box-shadow: 0 0 0 2px rgba(47,111,237,.14); }
    .ropt input { flex: 0 0 auto; accent-color: #2f6fed; }
    .ropt__img { width: 74px; height: 56px; border-radius: 8px; object-fit: cover; background: #eef3fa; }
    .ropt__txt { min-width: 0; }
    .ropt__name { font-size: 13px; font-weight: 700; line-height: 1.35; }
    .ropt__meta { margin-top: 3px; font-size: 11px; color: #7c8798; }
    .ropt__eta { color: #b47b12; font-weight: 700; }
    .rdlg__none { margin: 4px 0 0; font-size: 12.5px; color: #97a1b1; }
    .rdlg__form { margin: 14px 0 0; display: grid; gap: 9px; grid-template-columns: 1fr 1fr; }
    .rdlg__form label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: #7c8798; }
    .rdlg__form input {
      border: 1px solid #dbe6f5; border-radius: 9px; padding: 8px 10px;
      font: inherit; font-size: 13px; color: #1f2d3d; background: #fbfdff;
    }
    .rdlg__form input:focus { outline: none; border-color: #2f6fed; background: #fff; }
    /* 分隔线「或」 */
    .rdlg__sep {
      display: flex; align-items: center; gap: 10px;
      margin: 14px 0 10px; font-size: 11.5px; color: #8a94a6;
    }
    .rdlg__sepLine { flex: 1; height: 1px; background: #e0e9f6; }
    .rdlg__sepTxt { white-space: nowrap; }

    /* 自由输入车型 */
    .rdlg__custom {
      display: flex; flex-direction: column; gap: 4px;
      margin: 0 0 12px; font-size: 11.5px; color: #7c8798;
    }
    .rdlg__custom input {
      border: 1px solid #dbe6f5; border-radius: 9px; padding: 8px 10px;
      font: inherit; font-size: 13px; color: #1f2d3d; background: #fbfdff;
    }
    .rdlg__custom input:focus { outline: none; border-color: #2f6fed; background: #fff; }
    .rdlg__custom input.highlight { border-color: #2f6fed; box-shadow: 0 0 0 2px rgba(47,111,237,.14); }

    .rdlg__wide { grid-column: 1 / -1; }
    .rdlg__err { margin: 10px 0 0; font-size: 12px; color: #d2413a; min-height: 0; }
    .rdlg__actions { margin-top: 14px; display: flex; gap: 10px; justify-content: flex-end; }
    .rbtn {
      border: 1px solid #2f6fed; background: #2f6fed; color: #fff;
      border-radius: 10px; padding: 9px 18px; font: inherit; font-size: 13px;
      font-weight: 600; cursor: pointer;
    }
    .rbtn:hover { background: #2560d8; }
    .rbtn--ghost { background: #fff; color: #6b7a90; border-color: #dbe6f5; }
    .rbtn--ghost:hover { background: #f4f8ff; color: #2f6fed; }
    .rbtn:disabled { opacity: .55; cursor: default; }
    .rdlg__done { margin-top: 6px; }
    .rdlg__done h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; color: #1a7f5a; }
    .rdlg__done p { margin: 0 0 12px; font-size: 12.5px; color: #6b7a90; line-height: 1.7; }

    .rcars {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    }
    .rcar {
      border: 1px solid #e4ecf7; border-radius: 13px; overflow: hidden;
      background: #fff;
    }
    /* 车辆实拍图：统一 4:3 裁切，图上左上角标能源类型 */
    .rcar__img { position: relative; aspect-ratio: 4 / 3; background: #f1f5fb; }
    .rcar__img img {
      width: 100%; height: 100%; display: block; object-fit: cover;
    }
    .rcar__ev {
      position: absolute; left: 9px; top: 9px;
      padding: 2px 8px; border-radius: 999px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .3px;
      background: rgba(20,168,120,.94); color: #fff;
      box-shadow: 0 2px 8px rgba(20,120,90,.28);
    }
    .rcar__body { padding: 11px 13px 13px; }
    .rcar h3 { margin: 0 0 6px; font-size: 14.5px; font-weight: 700; line-height: 1.4; }
    .rcar__meta { font-size: 11.5px; color: #7c8798; }
    .rcar__prices {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e1eaf7;
    }
    .rcar__prices div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .rcar__prices span { font-size: 10.5px; color: #8a94a6; }
    .rcar__prices b { font-size: 13px; font-weight: 700; color: #1b3a6b; white-space: nowrap; }
    /* 车辆卡片可点击：点击弹出租赁天数选择 */
    .rcar { cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; }
    .rcar:hover { border-color: #b9d1f7; box-shadow: 0 10px 22px rgba(31,58,107,.13); transform: translateY(-1px); }

    /* ---------------- 租赁天数选择弹层（复用 rdlg 弹层骨架） ---------------- */
    .ddlg__car { display: flex; gap: 12px; align-items: center; border: 1px solid #e0e9f6; border-radius: 12px; padding: 9px; margin: 0 0 14px; }
    .ddlg__img { width: 88px; height: 64px; border-radius: 8px; object-fit: cover; background: #eef3fa; flex: 0 0 auto; }
    .ddlg__name { font-size: 13.5px; font-weight: 700; }
    .ddlg__meta { margin-top: 3px; font-size: 11.5px; color: #7c8798; }
    .ddlg__stepper { display: flex; align-items: center; gap: 14px; }
    .ddlg__btn {
      width: 38px; height: 38px; border-radius: 10px; flex: 0 0 auto;
      border: 1px solid #c9dcff; background: #f2f7ff; color: #2f6fed;
      font: inherit; font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer;
    }
    .ddlg__btn:hover { background: #e5efff; }
    .ddlg__btn:disabled { opacity: .45; cursor: default; }
    .ddlg__num { min-width: 92px; text-align: center; font-size: 16px; font-weight: 800; color: #1b3a6b; }
    .ddlg__num small { display: block; margin-top: 2px; font-size: 10.5px; font-weight: 500; color: #8a94a6; }
    .ddlg__total { margin: 12px 0 0; font-size: 12.5px; color: #6b7a90; }
    .ddlg__total b { color: #1b3a6b; font-size: 14px; }
    .ddlg__weekref { margin: 4px 0 0; font-size: 11.5px; color: #8a94a6; }

    /* 加载中 / 出错提示 */
    .rstate {
      max-width: 1240px; margin: 0 auto; padding: 34px 20px;
      font-size: 13px; color: #77839a; display: none; line-height: 1.8;
    }
    .rstate.show { display: block; }
    .rstate p { margin: 0 0 10px; }
    .rstate a { color: #2f6fed; text-decoration: none; font-weight: 600; }

    /* ---------------- 手机 / 窄屏 ---------------- */
    @media (max-width: 900px) {
      .rshell { grid-template-columns: 1fr; padding: 14px 12px 34px; gap: 14px; }
      .ragency { position: static; }
      .rcars { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .rhead__inner { padding: 10px 12px; gap: 10px; }
      .rhead__title { display: none; }
      .rcars { grid-template-columns: 1fr; }
      .ragency__name { font-size: 16px; }
    }
  </style>
</head>
<body>

<header class="rhead">
  <div class="rhead__inner">
    <a class="rhead__back" id="rback" href="map-play.html">← <span data-i18n="back"></span></a>
    <div class="rhead__title" data-i18n="title"></div>
    <div class="rlangs" id="rlangs">
      <button data-lang="zh" class="on">中文</button>
      <button data-lang="en">English</button>
      <button data-lang="ru">Русский</button>
    </div>
  </div>
</header>

<div class="rstate" id="rstate"></div>

<div class="rshell" id="rshell">
  <aside class="ragency">
    <div class="ragency__map">
      <img id="rmapImg" alt="">
      <a class="ragency__maplink" id="rmapLink" href="#" target="_blank" rel="noopener" data-i18n="openMap"></a>
    </div>
    <h1 class="ragency__name" id="rname"></h1>
    <div class="ragency__meta">
      <span class="rtag" id="rarea"></span>
      <span class="rtag rtag--rate" id="rrate"></span>
    </div>
    <dl class="rinfo">
      <div class="rinfo__row"><dt data-i18n="addr"></dt><dd id="raddr"></dd></div>
      <div class="rinfo__row"><dt data-i18n="hours"></dt><dd id="rhours"></dd></div>
    </dl>
    <p class="ragency__note" data-i18n="fromAmap"></p>
  </aside>
  <main class="rbody" id="rbody"></main>
</div>

<!-- 配车 / 车辆调度弹层（门店没有客户想要的车型时从这里发起） -->
<div class="rdlg" id="rdlg" hidden>
  <div class="rdlg__mask" id="rdlgMask"></div>
  <div class="rdlg__panel" role="dialog" aria-modal="true" aria-labelledby="rdlgTitle">
    <button class="rdlg__close" id="rdlgClose" type="button" aria-label="close">&times;</button>
    <h2 class="rdlg__title" id="rdlgTitle"></h2>
    <p class="rdlg__note" id="rdlgNote"></p>

    <div id="rdlgFormWrap">
      <div class="rdlg__pick" id="rdlgPick"></div>
      <div class="rdlg__opts" id="rdlgOpts"></div>
      <p class="rdlg__none" id="rdlgNone" hidden></p>

      <!-- 分隔线 + 自由输入 -->
      <div class="rdlg__sep" id="rdlgSep">
        <span class="rdlg__sepLine"></span>
        <span class="rdlg__sepTxt" data-i18n="dispatchOr"></span>
        <span class="rdlg__sepLine"></span>
      </div>
      <label class="rdlg__custom">
        <span data-i18n="dispatchCustom"></span>
        <input id="rdlgCustom" maxlength="60" placeholder="">
      </label>

      <div class="rdlg__form">
        <label><span data-i18n="dispatchName"></span><input id="rdlgName" maxlength="40" autocomplete="name"></label>
        <label><span data-i18n="dispatchPhone"></span><input id="rdlgPhone" maxlength="30" autocomplete="tel"></label>
        <label class="rdlg__wide"><span data-i18n="dispatchNoteLabel"></span><input id="rdlgNoteInput" maxlength="200"></label>
      </div>

      <div class="rdlg__err" id="rdlgErr"></div>
      <div class="rdlg__actions">
        <button class="rbtn rbtn--ghost" id="rdlgCancel" type="button" data-i18n="dispatchCancel"></button>
        <button class="rbtn" id="rdlgSubmit" type="button" data-i18n="dispatchSubmit"></button>
      </div>
    </div>

    <div class="rdlg__done" id="rdlgDone" hidden>
      <h3 id="rdlgOk"></h3>
      <p id="rdlgOkNote"></p>
      <button class="rbtn" id="rdlgDoneBtn" type="button" data-i18n="dispatchClose"></button>
    </div>
  </div>
</div>

<!-- 租赁天数选择弹层：点车辆卡片弹出；确定后把车辆信息 + 天数拼成纯文字跳回首页聊天发送 -->
<div class="rdlg" id="ddlg" hidden>
  <div class="rdlg__mask" id="ddlgMask"></div>
  <div class="rdlg__panel" role="dialog" aria-modal="true" aria-labelledby="ddlgTitle">
    <button class="rdlg__close" id="ddlgClose" type="button" aria-label="close">&times;</button>
    <h2 class="rdlg__title" id="ddlgTitle" data-i18n="daysTitle"></h2>
    <div class="ddlg__car" id="ddlgCar"></div>
    <div class="ddlg__stepper">
      <button class="ddlg__btn" id="ddlgMinus" type="button" aria-label="-">&minus;</button>
      <div class="ddlg__num"><span id="ddlgDays">1</span><small data-i18n="daysUnit"></small></div>
      <button class="ddlg__btn" id="ddlgPlus" type="button" aria-label="+">+</button>
    </div>
    <p class="ddlg__total" id="ddlgTotal"></p>
    <p class="ddlg__weekref" id="ddlgWeekref" hidden></p>
    <p class="rdlg__note" id="ddlgNote" data-i18n="daysNote" style="margin-top:12px"></p>
    <div class="rdlg__actions">
      <button class="rbtn rbtn--ghost" id="ddlgCancel" type="button" data-i18n="dispatchCancel"></button>
      <button class="rbtn" id="ddlgOk" type="button" data-i18n="daysConfirm"></button>
    </div>
  </div>
</div>

<script src="js/rental-i18n.js"></script>

  var lang = 'zh';
  var data = null;                 /* { item, cars:{ classes, fleet } } */
  var adcode = '';
  try {
    adcode = new URLSearchParams(location.search).get('adcode') || '';
  } catch (e) { adcode = ''; }

  function t() { return T[lang] || T.zh; }
  function pick(i18n, fallback) { return I18N.pickText(i18n, lang, fallback); }

  /* 静态文案（含返回链接）随语种切换 */
  function applyStatic() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
      var k = el.getAttribute('data-i18n');
      var v = t()[k];
      if (v != null) el.textContent = v;
    });
    Array.prototype.forEach.call($('rlangs').children, function (b) {
      b.classList.toggle('on', b.getAttribute('data-lang') === lang);
    });
  }

  function money(v) {
    var n = +v;
    return isFinite(n) && n > 0 ? '¥' + n : '—';
  }

  function priceCell(label, value) {
    var cell = document.createElement('div');
    var s = document.createElement('span');
    s.textContent = label;
    var b = document.createElement('b');
    b.textContent = value;
    cell.appendChild(s);
    cell.appendChild(b);
    return cell;
  }

  function carCard(car) {
    var card = document.createElement('article');
    card.className = 'rcar';

    /* 车辆照片（服务端已过滤掉没有图的车辆，这里拿到的一定有图） */
    var pic = document.createElement('div');
    pic.className = 'rcar__img';
    var img = document.createElement('img');
    img.src = car.image;
    img.alt = pick(car.names, '');
    img.loading = 'lazy';
    pic.appendChild(img);
    if (car.ev) {
      var ev = document.createElement('span');
      ev.className = 'rcar__ev';
      ev.textContent = t().ev;
      pic.appendChild(ev);
    }
    card.appendChild(pic);

    var body = document.createElement('div');
    body.className = 'rcar__body';

    var h = document.createElement('h3');
    h.textContent = pick(car.names, '') || '—';

    var meta = document.createElement('div');
    meta.className = 'rcar__meta';
    var bits = [];
    if (car.seats) bits.push(car.seats + ' ' + t().seatUnit);
    bits.push(car.gear === 'manual' ? t().gearManual : t().gearAuto);
    meta.textContent = bits.join(' · ');

    var prices = document.createElement('div');
    prices.className = 'rcar__prices';
    prices.appendChild(priceCell(t().day, money(car.day)));
    prices.appendChild(priceCell(t().week, money(car.week)));
    prices.appendChild(priceCell(t().deposit, money(car.deposit)));

    body.appendChild(h);
    body.appendChild(meta);
    body.appendChild(prices);
    card.appendChild(body);
    /* 点卡片 → 弹出租赁天数选择（确定后把车辆信息+天数发到首页聊天） */
    card.onclick = function () { openDaysDialog(car); };
    return card;
  }

  function section(cls) {
    var cars = (data && data.cars && data.cars.fleet && data.cars.fleet[cls.key]) || [];
    var box = document.createElement('section');
    box.className = 'rsec';

    var head = document.createElement('div');
    head.className = 'rsec__head';
    var seat = document.createElement('span');
    seat.className = 'rsec__seat';
    seat.textContent = cls.seats || '';
    var h2 = document.createElement('h2');
    h2.textContent = pick(cls.names, '');

    /* 配车按钮：任何档位都能发起调度（本店已有的车型不会出现在可调度列表里） */
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rsec__dispatch';
    btn.textContent = t().dispatch;
    btn.onclick = function () { openDispatch(cls.key); };

    var count = document.createElement('span');
    count.className = 'rsec__count';
    count.textContent = cars.length ? cars.length + ' ' + t().models : '';
    head.appendChild(seat);
    head.appendChild(h2);
    head.appendChild(btn);
    head.appendChild(count);
    box.appendChild(head);

    if (!cars.length) {
      var empty = document.createElement('p');
      empty.className = 'rsec__empty';
      empty.textContent = t().noCars;
      box.appendChild(empty);
      var hint = document.createElement('p');
      hint.className = 'rsec__hint';
      hint.textContent = t().dispatchHint;
      box.appendChild(hint);
      return box;
    }
    var grid = document.createElement('div');
    grid.className = 'rcars';
    cars.forEach(function (c) { grid.appendChild(carCard(c)); });
    box.appendChild(grid);
    return box;
  }

  function renderAgency() {
    var it = data.item;
    $('rname').textContent = I18N.agencyName(it, lang);
    $('rarea').textContent = I18N.areaName(it.area, lang);

    var rate = +it.rating;
    var rateEl = $('rrate');
    if (isFinite(rate) && rate > 0) {
      rateEl.textContent = t().ratingLabel + ' ' + rate.toFixed(1);
      rateEl.style.display = '';
    } else {
      rateEl.textContent = '';
      rateEl.style.display = 'none';
    }

    $('raddr').textContent = it.address || t().noInfo;

    var hours = Array.isArray(it.hours) ? it.hours.join(' / ') : (it.hours || '');
    $('rhours').textContent = hours || t().noInfo;

    $('rmapImg').src = '/api/rental/rental-map?adcode=' + encodeURIComponent(it.adcode);
    $('rmapLink').href = 'https://uri.amap.com/marker?position=' + it.lng + ',' + it.lat +
      '&name=' + encodeURIComponent(I18N.agencyName(it, lang)) +
      '&src=hainanmap&coordinate=gaode&callnative=0';
    document.title = I18N.agencyName(it, lang) + ' · ' + t().title;
  }

  function render() {
    if (!data) return;
    applyStatic();             /* 车辆板块里的文案也依赖当前语种 */
    renderAgency();
    var body = $('rbody');
    body.innerHTML = '';
    (data.cars.classes || []).forEach(function (c) { body.appendChild(section(c)); });
  }

  function showError(msg) {
    $('rshell').style.display = 'none';
    var box = $('rstate');
    box.innerHTML = '';
    var p = document.createElement('p');
    p.textContent = msg;
    var a = document.createElement('a');
    a.href = 'map-play.html';
    a.textContent = t().backMap;
    box.appendChild(p);
    box.appendChild(a);
    box.classList.add('show');
  }

  /* ---------------- 配车 / 车辆调度 ----------------
     门店没有客户想要的车型时，点板块标题上的「配车」发起调度：
     · 可调度车型 = 车辆库里启用、且本店没有的车（服务端实时比对库存）
     · 预估等待时间由后台按车型配置，弹层里明确提示「能否成功以实际情况为准」 */
  var dlg = { open: false, classKey: '', options: null, loading: false, selected: '', customInput: '', submitting: false };

  function fmtEta(mins) {
    var m = Math.max(0, Math.round(+mins || 0));
    if (m < 60) return m + ' ' + t().minute;
    var h = Math.floor(m / 60), rest = m % 60;
    return h + ' ' + t().hour + (rest ? ' ' + rest + ' ' + t().minute : '');
  }
  function dlgCar(id) {
    var items = (dlg.options && dlg.options.items) || [];
    for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i];
    return null;
  }

  function openDispatch(classKey) {
    dlg.open = true;
    dlg.classKey = classKey;
    dlg.selected = '';
    dlg.customInput = '';
    dlg.submitting = false;
    $('rdlgErr').textContent = '';
    $('rdlgCustom').value = '';
    $('rdlgCustom').classList.remove('highlight');
    $('rdlgFormWrap').hidden = false;
    $('rdlgDone').hidden = true;
    $('rdlgSubmit').disabled = false;
    $('rdlg').hidden = false;
    document.body.style.overflow = 'hidden';
    renderDialog();
    if (!dlg.options && !dlg.loading) loadDispatchOptions();
  }

  function closeDispatch() {
    dlg.open = false;
    $('rdlg').hidden = true;
    document.body.style.overflow = '';
  }

  function loadDispatchOptions() {
    dlg.loading = true;
    renderDialog();
    fetch('/api/rental/dispatch-options?adcode=' + encodeURIComponent(adcode), { cache: 'no-store' })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j && j.error ? j.error : 'HTTP ' + r.status);
          return j;
        });
      })
      .then(function (j) {
        dlg.loading = false;
        dlg.options = j;
        renderDialog();
      })
      .catch(function (e) {
        dlg.loading = false;
        dlg.options = { items: [], defaultEta: 120 };
        renderDialog();
        $('rdlgErr').textContent = t().dispatchFail + (e && e.message ? e.message : '');
      });
  }

  function renderOpts() {
    var box = $('rdlgOpts');
    box.innerHTML = '';
    var list = ((dlg.options && dlg.options.items) || []).filter(function (x) {
      return x.classKey === dlg.classKey;
    });
    $('rdlgNone').hidden = !(dlg.options && !list.length);
    $('rdlgNone').textContent = t().dispatchNone;

    list.forEach(function (it) {
      var lab = document.createElement('label');
      lab.className = 'ropt' + (dlg.selected === it.id ? ' on' : '');

      var radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'ropt';
      radio.value = it.id;
      radio.checked = dlg.selected === it.id;
      radio.onchange = function () {
        dlg.selected = it.id;
        dlg.customInput = '';
        $('rdlgCustom').value = '';
        $('rdlgCustom').classList.remove('highlight');
        renderDialog();
      };

      var img = document.createElement('img');
      img.className = 'ropt__img';
      img.src = it.image;
      img.alt = pick(it.names, '');
      img.loading = 'lazy';

      var txt = document.createElement('div');
      txt.className = 'ropt__txt';

      var nm = document.createElement('div');
      nm.className = 'ropt__name';
      nm.textContent = pick(it.names, '') || '—';

      var mt = document.createElement('div');
      mt.className = 'ropt__meta';
      var bits = [];
      if (it.seats) bits.push(it.seats + ' ' + t().seatUnit);
      bits.push(it.gear === 'manual' ? t().gearManual : t().gearAuto);
      if (it.ev) bits.push(t().ev);
      mt.textContent = bits.join(' · ');

      var et = document.createElement('div');
      et.className = 'ropt__meta';
      var eta = document.createElement('span');
      eta.className = 'ropt__meta ropt__eta';
      eta.textContent = t().dispatchEta + ' ' + fmtEta(it.eta);
      et.appendChild(eta);

      txt.appendChild(nm);
      txt.appendChild(mt);
      txt.appendChild(et);
      lab.appendChild(radio);
      lab.appendChild(img);
      lab.appendChild(txt);
      box.appendChild(lab);
    });
  }

  function renderDialog() {
    if (!dlg.open) return;
    var cls = null;
    ((data && data.cars && data.cars.classes) || []).forEach(function (c) {
      if (c.key === dlg.classKey) cls = c;
    });
    $('rdlgTitle').textContent = t().dispatchTitle +
      (cls && cls.seats ? ' · ' + cls.seats + ' ' + t().seatUnit : '');
    var sel = dlg.selected ? dlgCar(dlg.selected) : null;
    var eta = sel ? sel.eta : (dlg.options ? dlg.options.defaultEta : null);
    $('rdlgNote').textContent = t().dispatchNote.replace('{eta}', eta ? fmtEta(eta) : '—');
    $('rdlgPick').textContent = dlg.options ? t().dispatchPick : t().dispatchLoading;
    $('rdlgCustom').setAttribute('placeholder', t().dispatchCustomPlaceholder);
    renderOpts();
  }

  function submitDispatch() {
    if (dlg.submitting) return;
    $('rdlgErr').textContent = '';

    var customVal = ($('rdlgCustom').value || '').trim();
    var hasPick = !!dlg.selected;
    var hasCustom = customVal.length > 0;

    if (!hasPick && !hasCustom) {
      $('rdlgErr').textContent = t().dispatchNeedPick;
      $('rdlgCustom').classList.add('highlight');
      return;
    }
    $('rdlgCustom').classList.remove('highlight');

    dlg.submitting = true;
    $('rdlgSubmit').disabled = true;

    var selCar = dlg.selected ? dlgCar(dlg.selected) : null;
    var eta = selCar ? selCar.eta : (dlg.options ? dlg.options.defaultEta : null);
    var modelName = hasPick ? pick(selCar.names, '') : customVal;

    fetch('/api/rental/dispatch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        adcode: adcode,
        carId: dlg.selected || '',
        customModel: hasCustom ? customVal : '',
        name: $('rdlgName').value,
        phone: $('rdlgPhone').value,
        note: $('rdlgNoteInput').value
      })
    })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j && j.error ? j.error : 'HTTP ' + r.status);
          return j;
        });
      })
      .then(function (j) {
        dlg.submitting = false;
        $('rdlgFormWrap').hidden = true;
        $('rdlgDone').hidden = false;
        $('rdlgOk').textContent = t().dispatchOk + ' · ' + modelName;
        var finalEta = (j.item && j.item.eta) != null ? j.item.eta : eta;
        $('rdlgOkNote').textContent = t().dispatchOkNote + ' ' +
          t().dispatchEta + ' ' + fmtEta(finalEta);
        /* 提交后本店的可调度清单会变化，下次打开重新拉一次 */
        dlg.selected = '';
        dlg.customInput = '';
        dlg.options = null;
      })
      .catch(function (e) {
        dlg.submitting = false;
        $('rdlgSubmit').disabled = false;
        $('rdlgErr').textContent = t().dispatchFail + (e && e.message ? e.message : '');
      });
  }

  $('rdlgClose').onclick = closeDispatch;
  $('rdlgCancel').onclick = closeDispatch;
  $('rdlgMask').onclick = closeDispatch;
  $('rdlgSubmit').onclick = submitDispatch;
  $('rdlgDoneBtn').onclick = closeDispatch;

  /* ---------------- 租赁天数选择 ----------------
     点车辆卡片弹出：选好天数点「确定」，把车辆信息 + 天数拼成纯文字存入
     sessionStorage 后跳回首页，由首页聊天作为普通文字消息发出（不用卡片）。 */
  var ddlg = { open: false, car: null, days: 1 };
  var DAYS_MIN = 1, DAYS_MAX = 30;
  var DRAFT_KEY = 'beisu_rental_inquiry';

  function openDaysDialog(car) {
    ddlg.open = true;
    ddlg.car = car;
    ddlg.days = DAYS_MIN;
    renderDaysDialog();
    $('ddlg').hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeDaysDialog() {
    ddlg.open = false;
    $('ddlg').hidden = true;
    document.body.style.overflow = '';
  }

  function renderDaysDialog() {
    var car = ddlg.car;
    if (!car) return;
    /* 车辆摘要：图 + 名称 + 座位/变速箱 */
    var box = $('ddlgCar');
    box.innerHTML = '';
    var img = document.createElement('img');
    img.className = 'ddlg__img';
    img.src = car.image;
    img.alt = pick(car.names, '');
    box.appendChild(img);
    var txt = document.createElement('div');
    var name = document.createElement('div');
    name.className = 'ddlg__name';
    name.textContent = pick(car.names, '') || '—';
    var meta = document.createElement('div');
    meta.className = 'ddlg__meta';
    var metaBits = [];
    if (car.seats) metaBits.push(car.seats + ' ' + t().seatUnit);
    metaBits.push(car.gear === 'manual' ? t().gearManual : t().gearAuto);
    meta.textContent = metaBits.join(' · ');
    txt.appendChild(name);
    txt.appendChild(meta);
    box.appendChild(txt);

    $('ddlgDays').textContent = ddlg.days;
    $('ddlgMinus').disabled = ddlg.days <= DAYS_MIN;
    $('ddlgPlus').disabled = ddlg.days >= DAYS_MAX;

    /* 预估租金：7 的倍数天 + 有周租 → 自动按周算；否则按日算 */
    var day = +car.day;
    var week = +car.week;
    var total = $('ddlgTotal');
    var weekref = $('ddlgWeekref');
    var byWeek = (ddlg.days % 7 === 0) && isFinite(week) && week > 0;   /* 命中周租优惠的条件 */
    if (byWeek) {
      var wcount = ddlg.days / 7;
      total.style.display = '';
      total.textContent = t().daysEst + '：';
      var b = document.createElement('b');
      b.textContent = '¥' + (week * wcount);
      total.appendChild(b);
      var calc = document.createElement('span');
      calc.textContent = '（' + money(car.week) + ' × ' + wcount + ' ' + t().week + '）';
      total.appendChild(calc);
      /* 既然是 7 的倍数，周租本身就是主展示，隐藏「周租参考」那一行 */
      weekref.hidden = true;
      weekref.textContent = '';
    } else if (isFinite(day) && day > 0) {
      total.style.display = '';
      total.textContent = t().daysEst + '：';
      var b2 = document.createElement('b');
      b2.textContent = '¥' + (day * ddlg.days);
      total.appendChild(b2);
      var calc2 = document.createElement('span');
      calc2.textContent = '（' + money(car.day) + ' × ' + ddlg.days + ' ' + t().daysUnit + '）';
      total.appendChild(calc2);
      /* 非 7 倍数 + 有周租 → 显示一行小字参考价 */
      if (isFinite(week) && week > 0) {
        weekref.hidden = false;
        weekref.textContent = t().daysWeekref + '：' + money(car.week) + ' / ' + t().week;
      } else {
        weekref.hidden = true;
        weekref.textContent = '';
      }
    } else {
      total.style.display = 'none';
      total.textContent = '';
      weekref.hidden = true;
      weekref.textContent = '';
    }
  }

  /* 拼接发送到首页聊天的纯文字（当前语种），格式对齐【预订摘要】 */
  function buildInquiryText() {
    var car = ddlg.car;
    var C = lang === 'zh' ? '：' : ': ';
    var open = lang === 'zh' ? '（' : ' (';
    var close = lang === 'zh' ? '）' : ')';
    var metaBits = [];
    if (car.seats) metaBits.push(car.seats + t().seatUnit);
    metaBits.push(car.gear === 'manual' ? t().gearManual : t().gearAuto);
    var day = +car.day;
    var week = +car.week;
    var parts = [
      t().inqAgency + C + (data && data.item ? I18N.agencyName(data.item, lang) : '—'),
      t().inqModel + C + (pick(car.names, '') || '—') + open + metaBits.join(' · ') + close
    ];
    /* 总价：7 的倍数 + 有周租 → 按周算；否则按日算 */
    var byWeek = (ddlg.days % 7 === 0) && isFinite(week) && week > 0;
    if (byWeek) {
      var wcount = ddlg.days / 7;
      parts.push(t().week + C + money(car.week));
      parts.push(t().inqTotal + C + '¥' + (week * wcount) + '（' + wcount + ' ' + t().week + '）');
    } else {
      if (isFinite(day) && day > 0) {
        parts.push(t().day + C + money(car.day));
        parts.push(t().inqTotal + C + '¥' + (day * ddlg.days));
      }
      if (isFinite(week) && week > 0) {
        parts.push(t().week + C + money(car.week));
      }
    }
    parts.push(t().inqDays + C + ddlg.days + t().daysUnit);
    return t().inqLabel + parts.join(' · ');
  }

  function confirmDays() {
    try { sessionStorage.setItem(DRAFT_KEY, buildInquiryText()); } catch (e) {}
    closeDaysDialog();
    location.href = '/';
  }

  $('ddlgClose').onclick = closeDaysDialog;
  $('ddlgCancel').onclick = closeDaysDialog;
  $('ddlgMask').onclick = closeDaysDialog;
  $('ddlgMinus').onclick = function () { if (ddlg.days > DAYS_MIN) { ddlg.days--; renderDaysDialog(); } };
  $('ddlgPlus').onclick = function () { if (ddlg.days < DAYS_MAX) { ddlg.days++; renderDaysDialog(); } };
  $('ddlgOk').onclick = confirmDays;

  $('rdlgCustom').addEventListener('input', function () {
    var v = ($('rdlgCustom').value || '').trim();
    dlg.customInput = v;
    if (v.length > 0 && dlg.selected) {
      dlg.selected = '';
      renderOpts();
    }
    $('rdlgCustom').classList.toggle('highlight', !!(v.length > 0));
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && dlg.open) closeDispatch();
    if (e.key === 'Escape' && ddlg.open) closeDaysDialog();
  });

  function setLang(next) {
    lang = LANGS.indexOf(next) >= 0 ? next : 'zh';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    applyStatic();
    if (data) render();
    else $('rstate').textContent = t().loading;
    if (dlg.open) renderDialog();     /* 弹层开着时也要跟着切语种 */
    if (ddlg.open) renderDaysDialog();
  }

  Array.prototype.forEach.call($('rlangs').children, function (b) {
    b.onclick = function () { setLang(b.getAttribute('data-lang')); };
  });

  /* 门店位置小地图加载失败时，退化成一块浅色底，不显示破图 */
  $('rmapImg').onerror = function () { this.style.visibility = 'hidden'; };

  function boot() {
    var saved = '';
    try { saved = localStorage.getItem(LANG_KEY) || ''; } catch (e) {}
    lang = LANGS.indexOf(saved) >= 0 ? saved : 'zh';
    applyStatic();
    $('rstate').textContent = t().loading;
    $('rstate').classList.add('show');

    if (!adcode) { showError(t().notFound); return; }

    fetch('/api/rental/rental-agency?adcode=' + encodeURIComponent(adcode), { cache: 'no-store' })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j && j.error ? j.error : 'HTTP ' + r.status);
          return j;
        });
      })
      .then(function (j) {
        data = j;
        $('rstate').classList.remove('show');
        render();
      })
      .catch(function (e) {
        showError(t().fail + (e && e.message ? e.message : ''));
      });
  }

  boot();
})();
</script>
</body>
</html>
